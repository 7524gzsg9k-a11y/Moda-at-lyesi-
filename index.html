<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Moda Atölyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;700&family=Dancing+Script:wght@600&family=Oswald:wght@500&family=Caveat:wght@600&display=swap">
<style>
/* Düzen: solda dikey araç şeridi, ortada çizim alanı, sağda sekmeli panel; üstte mod geçişi (Tasarım / Desen / Defter). */
:root{
  --bg:#e7e9ed; --panel:#f4f5f7; --panel2:#ffffff; --line:#d0d4da; --fg:#171b20; --muted:#58626d;
  --accent:#15766a; --accent-fg:#ffffff; --accent-soft:#d2ebe6; --danger:#b3261e; --stage:#cdd1d8;
  --ink-grid:rgba(20,30,40,.14); --shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.10);
  --f-ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace; --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121518; --panel:#1b1f23; --panel2:#242a30; --line:#343c44; --fg:#e9ecef; --muted:#9aa5b0;
    --accent:#4dbfae; --accent-fg:#05201c; --accent-soft:#1c3a36; --danger:#f3877f; --stage:#0e1114;
    --ink-grid:rgba(230,240,250,.16); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121518; --panel:#1b1f23; --panel2:#242a30; --line:#343c44; --fg:#e9ecef; --muted:#9aa5b0;
  --accent:#4dbfae; --accent-fg:#05201c; --accent-soft:#1c3a36; --danger:#f3877f; --stage:#0e1114;
  --ink-grid:rgba(230,240,250,.16); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font:14px/1.4 var(--f-ui); overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* üst çubuk */
#top{display:flex;align-items:center;gap:10px;padding:8px 0;flex:none;min-width:0;overflow-x:auto;scrollbar-width:none}
#top>*{flex-shrink:0}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--accent)}
#modes{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
#modes button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);min-height:38px}
#modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
#projName{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:38px;width:190px;min-width:90px;font-weight:600;user-select:text;-webkit-user-select:text}
.spacer{flex:1}
.grp{display:flex;gap:4px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);white-space:nowrap}
.ibtn:hover{border-color:var(--accent)}
.ibtn[aria-pressed="true"],.ibtn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ibtn:disabled{opacity:.4;cursor:default}
.ibtn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.ibtn.danger{color:var(--danger)}
#saveState{font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
#btnPanel{display:none}

/* çalışma alanı */
#work{flex:1;min-height:0;display:flex;gap:8px;padding-bottom:8px;position:relative}
#tools{flex:none;width:64px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;border-radius:10px;border:0;background:none;color:var(--fg);min-height:52px}
.tool span{font-size:10.5px;color:var(--muted);line-height:1.1;text-align:center}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tool[aria-pressed="true"] span{color:var(--accent-fg)}
.tsep{height:1px;background:var(--line);margin:4px 8px;flex:none}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--stage);position:relative}
#cvwrap{flex:1;min-height:0;position:relative;touch-action:none}
#cv{position:absolute;inset:0;display:block;touch-action:none;cursor:crosshair}
#quick{flex:none;display:flex;align-items:center;gap:14px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
.qs{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;color:var(--muted)}
.qs input[type=range]{width:110px}
.qs b{font:500 12px var(--f-mono);color:var(--fg);min-width:30px;display:inline-block}
input[type=range]{accent-color:var(--accent);height:28px;min-width:0}
#float{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;z-index:5}
#float[hidden]{display:none}
#float label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#prevCard{position:absolute;right:12px;top:12px;width:236px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:4;display:flex;flex-direction:column;gap:6px}
#prevCard[hidden]{display:none}
#prevCard canvas{width:100%;aspect-ratio:1;border-radius:8px;background:#fff;display:block}
#prevCard .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:20;max-width:80%;text-align:center}
#toast.show{opacity:.96}

/* yan panel */
#side{flex:none;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#quick{overflow-x:auto;max-width:100%;scrollbar-width:thin}
#quick>*{flex:none}
#sideTabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex:none}
#sideTabs>button{flex:none;white-space:nowrap}
#sideTabs::-webkit-scrollbar{display:none}
#sideTabs button{border:0;background:none;padding:8px 11px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;min-height:38px}
#sideTabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
#sideBody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px;min-height:0;overscroll-behavior:contain}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row>label{font-size:12.5px;color:var(--muted);min-width:78px}
.row input[type=range]{flex:1}
.row output{font:500 12px var(--f-mono);min-width:38px;text-align:right}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);min-height:34px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-height:36px;user-select:text;-webkit-user-select:text}
select{max-width:100%}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow .ibtn{flex:1;font-size:13px}
.note{font-size:12px;color:var(--muted)}
.empty{font-size:12.5px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:10px;text-align:center}

/* renk */
.fgbg{position:relative;width:54px;height:54px;flex:none}
.fgbg i{position:absolute;width:34px;height:34px;border-radius:9px;border:2px solid var(--panel2);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.fgbg i.f{left:0;top:0;z-index:2}.fgbg i.b{right:0;bottom:0}
#svBox{position:relative;height:150px;border-radius:10px;overflow:hidden;touch-action:none;cursor:crosshair}
#svBox canvas,#hueBar canvas{width:100%;height:100%;display:block}
#hueBar{position:relative;height:22px;border-radius:11px;overflow:hidden;touch-action:none}
.knob{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.sw button{aspect-ratio:1;border-radius:8px;border:1px solid rgba(0,0,0,.18);padding:0;min-height:30px}
.sw button[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.hex{font:500 13px var(--f-mono);width:92px;text-transform:uppercase}
.cname{font-size:13px;font-weight:600}

/* katmanlar */
.lrow{display:flex;align-items:center;gap:6px;padding:5px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);min-height:50px}
.lrow[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--ring,rgba(21,118,106,.28))}
.lrow canvas{width:34px;height:44px;border-radius:5px;background:repeating-conic-gradient(#d8dbe0 0 25%,#fff 0 50%) 0 0/10px 10px;flex:none;border:1px solid var(--line)}
.lrow .nm{flex:1;min-width:0;border:0;background:none;padding:4px;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:30px;user-select:text;-webkit-user-select:text}
.lrow .sm{width:34px;height:34px;min-width:34px;padding:0;border-radius:8px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.lrow .sm.on{color:var(--accent)}
.lrow .sm svg{width:19px;height:19px}
.tag{font:10px var(--f-mono);background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:5px}

/* kartlar */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;min-height:44px}
.card canvas{width:100%;aspect-ratio:2/3;background:#fff;border-radius:6px;display:block}
.card.sq canvas{aspect-ratio:1}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card:hover{border-color:var(--accent)}
.bcards{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bcards .card{flex-direction:row;justify-content:flex-start;padding:8px 10px;font-size:12.5px;gap:8px}
.bcards .card svg{width:30px;height:20px;flex:none}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,10,15,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);max-height:90%;display:flex;flex-direction:column;overflow:hidden}
.dlg>.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.dlg>.bd{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.dlg>.ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden;display:flex;flex-direction:column}
.pcard img,.pcard .ph{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;display:block}
.pcard .mt{padding:8px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.pcard .mt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .mt small{color:var(--muted);font:11px var(--f-mono)}

/* defter (moodboard) */
#board{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
#board[hidden]{display:none}
#bTools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px}
#bArea{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:14px;position:relative;background:var(--stage)}
#bInner{position:relative;width:3000px;height:2000px;background-image:radial-gradient(var(--ink-grid) 1px,transparent 1px);background-size:28px 28px}
.bi{position:absolute;touch-action:none;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.bi.sel{outline:2px solid var(--accent);outline-offset:2px}
.bi img{width:100%;height:100%;object-fit:cover;display:block;border-radius:6px;pointer-events:none}
.bi.note{background:#fff3b0;color:#2a2a2a;padding:10px;font:600 20px/1.25 'Caveat',var(--f-ui);overflow:hidden}
.bi.title{background:none;box-shadow:none;font:700 38px/1.1 'Playfair Display',serif;color:var(--fg);padding:4px}
.bi [contenteditable]{outline:none;width:100%;height:100%;user-select:text;-webkit-user-select:text;white-space:pre-wrap}
.bi.pal{display:flex;background:#fff;padding:6px;gap:0;border-radius:8px}
.bi.pal div{flex:1;display:flex;align-items:flex-end;justify-content:center;font:500 10px var(--f-mono);color:#fff;text-shadow:0 0 3px rgba(0,0,0,.7);padding-bottom:4px;cursor:pointer;overflow:hidden}
.bhandle{position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:2px solid var(--panel2);cursor:nwse-resize;touch-action:none}
.bbar{position:absolute;left:0;top:-42px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow);z-index:3}
.bbar button{width:34px;height:34px;border:0;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center}
.bbar button:hover{background:var(--accent-soft)}

@media (max-width:980px) and (min-width:701px){#side{width:300px}}
@media (max-width:700px){
  html,body{overflow-x:hidden}
  #side{position:absolute;right:0;top:0;bottom:0;width:min(360px,92%);z-index:15;transform:translateX(105%);transition:transform .22s ease;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #btnPanel{display:inline-flex;gap:6px}
}
@media (max-width:980px){
  #projName{display:none}
  .brand span{display:none}
  #prevCard{width:170px}
}
@media (max-width:640px){
  #btnKeys,#btnCmd{display:none}
  .brand{padding-right:2px}
  #projName{display:none}
  #modes button{padding:8px 10px}
  #saveState{display:none}
  .ibtn .lbl{display:none}
  #btnGallery,#btnExport{font-size:0;padding:0 10px;min-width:40px;gap:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

kbd{font:500 11.5px var(--f-mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line);border-bottom-width:2px;background:var(--panel2);color:var(--fg)}
.kbd{display:inline-flex;gap:3px;flex:none}
.keygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:6px 22px;margin-top:10px}
.kgrp h4{margin:12px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.krow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.plist{margin-top:10px;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--fg);padding:10px 12px;border-radius:10px;font-size:14.5px;min-height:44px}
.prow small{color:var(--muted);font-size:12px}
.prow[aria-selected="true"],.prow:hover{background:var(--accent-soft)}
body.focus #side,body.focus #tools,body.focus #quick{display:none}
.card.sq canvas{width:100%;height:auto;display:block}
@media(max-width:1150px){#btnCmd{display:none}#projName{max-width:150px}}
@media(max-width:900px){#btnKeys{display:none}}
</style>
<div id="app">
  <header id="top">
    <div class="brand">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 3c-2 0-3 1.2-3 2.6S10 8 12 8s3-1 3-2.4S14 3 12 3z"/><path d="M12 8v2.5L4.5 17a1.6 1.6 0 0 0 1 2.8h13a1.6 1.6 0 0 0 1-2.8L12 10.5"/></svg>
      <span>Moda Atölyesi</span>
    </div>
    <nav id="modes" role="tablist" aria-label="Çalışma modu">
      <button role="tab" data-mode="design" aria-selected="true">Tasarım</button>
      <button role="tab" data-mode="pattern" aria-selected="false">Desen</button>
      <button role="tab" data-mode="board" aria-selected="false">Defter</button>
    </nav>
    <input id="projName" type="text" aria-label="Proje adı" value="İsimsiz tasarım" maxlength="60">
    <div class="spacer"></div>
    <div class="grp">
      <button class="ibtn" id="btnUndo" aria-label="Geri al" title="Geri al (iki parmakla dokun)"></button>
      <button class="ibtn" id="btnRedo" aria-label="Yinele" title="Yinele"></button>
    </div>
    <span id="saveState"></span>
    <button class="ibtn" id="btnGallery" aria-label="Projelerim"></button>
    <button class="ibtn pri" id="btnExport" aria-label="Dışa aktar"></button>
    <button class="ibtn" id="btnCmd" aria-label="Komut ara (Ctrl+K)" title="Komut ara (Ctrl+K)">Ara</button>
    <button class="ibtn" id="btnKeys" aria-label="Kısayollar (?)" title="Kısayollar (?)">⌨</button>
    <button class="ibtn" id="btnTheme" aria-label="Tema"></button>
    <button class="ibtn" id="btnPanel" aria-label="Paneller"></button>
  </header>

  <div id="work">
    <aside id="tools" aria-label="Araçlar"></aside>
    <main id="stage">
      <div id="cvwrap"><canvas id="cv"></canvas></div>
      <div id="float" hidden></div>
      <div id="prevCard" hidden></div>
      <div id="toast" role="status"></div>
      <div id="quick"></div>
    </main>
    <aside id="side" aria-label="Paneller">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:12px;color:var(--muted)">Asistan (çevrimdışı)</span><button id="assistTog" class="ibtn" style="min-height:24px;padding:0 8px;font-size:12px" aria-expanded="true">Gizle</button></div>

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const c of kids.flat(3)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
  return e;
}

/* renk dönüşümleri */
function hex2rgb(hx){hx=hx.replace('#','');if(hx.length===3)hx=hx.split('').map(c=>c+c).join('');const n=parseInt(hx,16)||0;return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hh=0;
  if(d){if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;hh*=60;if(hh<0)hh+=360;}
  return[hh,mx?d/mx:0,mx];}
function hsv2rgb(hh,s,v){const c=v*s,x=c*(1-Math.abs((hh/60)%2-1)),m=v-c;let r=0,g=0,b=0;
  if(hh<60){r=c;g=x;}else if(hh<120){r=x;g=c;}else if(hh<180){g=c;b=x;}else if(hh<240){g=x;b=c;}else if(hh<300){r=x;b=c;}else{r=c;b=x;}
  return[(r+m)*255,(g+m)*255,(b+m)*255];}
const hsv2hex=(a,b,c)=>rgb2hex(...hsv2rgb(a,b,c));
const hex2hsv=hx=>rgb2hsv(...hex2rgb(hx));
const validHex=s=>/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(s.trim());
const normHex=s=>{s=s.trim().replace('#','');if(s.length===3)s=s.split('').map(c=>c+c).join('');return'#'+s.toLowerCase();};
function colorName(hx){
  const[r,g,b]=hex2rgb(hx),[hh,s,v]=rgb2hsv(r,g,b);
  if(v<.12)return'Siyah';
  if(s<.09){if(v>.96)return'Beyaz';if(v>.84)return'Kırık beyaz';if(v>.62)return'Açık gri';if(v>.38)return'Gri';return'Antrasit';}
  let base;
  if(hh<12||hh>=346)base='Kırmızı';else if(hh<38)base='Turuncu';else if(hh<68)base='Sarı';else if(hh<95)base='Limon yeşili';
  else if(hh<165)base='Yeşil';else if(hh<195)base='Turkuaz';else if(hh<225)base='Gök mavisi';else if(hh<255)base='Mavi';
  else if(hh<290)base='Mor';else if(hh<325)base='Fuşya';else base='Pembe';
  if(hh>=8&&hh<50&&v<.62&&s>.25)return(v<.35?'Koyu ':'')+'Kahverengi';
  if(hh>=18&&hh<55&&s<.5&&v>=.62)return s<.3?'Bej':'Krem';
  if(v<.38)return'Koyu '+base.toLowerCase();
  if(s<.4&&v>.8)return'Pastel '+base.toLowerCase();
  if(s<.62&&v>.78)return'Açık '+base.toLowerCase();
  return base;
}

/* ============ depolama (IndexedDB) ============ */
const IDB={db:null,ok:false,
  open(){return new Promise(res=>{try{const r=indexedDB.open('moda-atolyesi',1);
    r.onupgradeneeded=()=>{const d=r.result;['projects','patterns','kv'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:n==='kv'?'key':'id'});});};
    r.onsuccess=()=>{this.db=r.result;this.ok=true;res(true);};r.onerror=()=>res(false);r.onblocked=()=>res(false);}catch(e){res(false);}});},
  tx(store,mode,fn){return new Promise((res,rej)=>{if(!this.ok)return rej(new Error('nodb'));
    try{const t=this.db.transaction(store,mode);const rq=fn(t.objectStore(store));
      t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}catch(e){rej(e);}});},
  get(s,k){return this.tx(s,'readonly',o=>o.get(k)).catch(()=>undefined);},
  put(s,v){return this.tx(s,'readwrite',o=>o.put(v));},
  all(s){return this.tx(s,'readonly',o=>o.getAll()).then(r=>r||[]).catch(()=>[]);},
  del(s,k){return this.tx(s,'readwrite',o=>o.delete(k)).catch(()=>{});}
};
const kvGet=async(k,d)=>{const r=await IDB.get('kv',k);return r?r.val:d;};

const LAYER_MEM=240*1024*1024;
function maxLayers(doc){return clamp(Math.floor(LAYER_MEM/(doc.w*doc.h*4)),4,24);}
function makeLayer(doc,name){const c=newCanvas(doc.w,doc.h);
  return{id:uid(),name:name||'Katman',canvas:c,ctx:c.getContext('2d'),visible:true,opacity:1,blend:'source-over',locked:false,alphaLock:false,ref:false,tag:''};}
function makeDoc(w,hh,kind){
  const d={kind,w,h:hh,layers:[],active:0,bg:{color:'#ffffff',visible:true},view:{x:0,y:0,z:1},hist:{u:[],r:[],bytes:0},wrap:kind==='pattern'};
  d.backup=newCanvas(w,hh);d.bctx=d.backup.getContext('2d');

/* ============ geçmiş (geri al / yinele) ============ */
/* önbellek sürümü: sayfa değişince artar, katman önbellekleri yeniden kurulur */
function bumpRev(){if(DOCS.design)DOCS.design.rev=(DOCS.design.rev||0)+1;if(DOCS.pattern)DOCS.pattern.rev=(DOCS.pattern.rev||0)+1;}
function markDirty(){bumpRev();if(P){P.dirty=true;scheduleSave();}}
function histPush(doc,e){bumpRev();const hh=doc.hist;hh.u.push(e);hh.bytes+=e.bytes||0;hh.r.length=0;
  while(hh.u.length>60||(hh.bytes>170e6&&hh.u.length>1)){const o=hh.u.shift();hh.bytes-=o.bytes||0;}
  markDirty();updateUndoUI();}
function applyEntry(doc,e,dir){
  if(e.t==='px'){const L=doc.layers.find(l=>l.id===e.layer);if(L)L.ctx.putImageData(dir==='undo'?e.before:e.after,e.x,e.y);}
  else if(e.t==='fn'){dir==='undo'?e.undo():e.redo();}
}
function undo(){const doc=D();if(S.mode==='board')return;cancelTransient();const e=doc.hist.u.pop();if(!e)return;doc.hist.bytes-=e.bytes||0;applyEntry(doc,e,'undo');doc.hist.r.push(e);afterHist();}
function redo(){const doc=D();if(S.mode==='board')return;cancelTransient();const e=doc.hist.r.pop();if(!e)return;applyEntry(doc,e,'redo');doc.hist.u.push(e);doc.hist.bytes+=e.bytes||0;afterHist();}
function afterHist(){bumpRev();fixActive(D());invalidate();refreshLayers();updateUndoUI();markDirty();if(S.mode==='pattern')drawPrev();}
function fixActive(doc){doc.active=clamp(doc.active,0,Math.max(0,doc.layers.length-1));}
function updateUndoUI(){const doc=D();$('#btnUndo').disabled=!doc||!doc.hist.u.length;$('#btnRedo').disabled=!doc||!doc.hist.r.length;}
function pxEntry(doc,L,x,y,w,hh,before){
  const after=L.ctx.getImageData(x,y,w,hh);
  histPush(doc,{t:'px',layer:L.id,x,y,w,h:hh,before,after,bytes:w*hh*8});
}
function fullSnap(L){return L.ctx.getImageData(0,0,L.canvas.width,L.canvas.height);}
function structEntry(doc,undoF,redoF,bytes){histPush(doc,{t:'fn',undo:undoF,redo:redoF,bytes:bytes||0});}

function invalidate(){if(!needRender){needRender=true;requestAnimationFrame(render);}}
function readCss(){const cs=getComputedStyle(document.documentElement);cssC={grid:cs.getPropertyValue('--ink-grid').trim()||'rgba(0,0,0,.15)',acc:cs.getPropertyValue('--accent').trim()||'#15766a'};}
function resizeCv(){const r=$('#cvwrap').getBoundingClientRect();DPR=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*DPR));cv.height=Math.max(1,Math.round(r.height*DPR));
  cv.style.width=r.width+'px';cv.style.height=r.height+'px';invalidate();}
/* sayfa tuvalin dışına çıkamaz: büyütülmüş sayfanın kenarı ekran kenarında durur; sayfa sığıyorsa ortalanır */
function clampView(doc){doc=doc||D();if(!doc||!doc.view)return;const r=$('#cvwrap').getBoundingClientRect();if(!r.width)return;
  const m=0,W=doc.w*doc.view.z,H=doc.h*doc.view.z;
  doc.view.x=W<=r.width?(r.width-W)/2:clamp(doc.view.x,r.width-W-m,m);
  doc.view.y=H<=r.height?(r.height-H)/2:clamp(doc.view.y,r.height-H-m,m);}
function fitView(doc){doc=doc||D();const r=$('#cvwrap').getBoundingClientRect();if(!r.width||!doc)return;
  const pad=22,z=Math.max(.04,Math.min((r.width-pad*2)/doc.w,(r.height-pad*2)/doc.h));
  doc.view.z=z;doc.view.fitZ=z;doc.view.x=(r.width-doc.w*z)/2;doc.view.y=(r.height-doc.h*z)/2;invalidate();updateZoomLabel();}
function zoomAt(px,py,nz){const v=D().view;nz=clamp(nz,.04,20);const k=nz/v.z;v.x=px-(px-v.x)*k;v.y=py-(py-v.y)*k;v.z=nz;clampView();invalidate();updateZoomLabel();}
function updateZoomLabel(){const b=$('#zoomLbl');if(b&&D())b.textContent=Math.round(D().view.z*100)+'%';}
const checker=(()=>{const c=newCanvas(20,20),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,20,20);g.fillStyle='#d9dce1';g.fillRect(0,0,10,10);g.fillRect(10,10,10,10);return c;})();

const MOVE={on:false,dx:0,dy:0,s:1,rot:0,flip:false,all:false,px:0,py:0,persp:false,pc:null,pdrag:-1};

/* görünür alan (doc koordinatı): ekran dışındaki sayfa parçaları çizilmez, yakınlaşınca kare süresi düşer */
let VIS=null;
let FASTCACHE=true;
/* katman önbelleği: aktif katmanın altı (below) ve üstü (above) ayrı tuvallerde birleşik tutulur */
function cacheEligible(doc){
  if(MOVE.on)return false;

  return doc.layers.length>1;
}
function ensureCache(doc){
  const key=(doc.rev||0)+':'+doc.active+':'+doc.layers.length;
  const c=doc.cache||(doc.cache={});
  if(c.key===key)return c;
  c.key=key;
  if(!c.below){c.below=newCanvas(doc.w,doc.h);c.above=newCanvas(doc.w,doc.h);}
  const fill=(cv,from,to)=>{const g=cv.getContext('2d');g.clearRect(0,0,doc.w,doc.h);
    for(let i=from;i<to;i++){const L=doc.layers[i];if(!L.visible)continue;g.globalAlpha=L.opacity;g.drawImage(L.canvas,0,0);}g.globalAlpha=1;};
  fill(c.below,0,doc.active);fill(c.above,doc.active+1,doc.layers.length);
  return c;
}
function drawCached(g,doc,R){
  const c=ensureCache(doc);
  g.globalAlpha=1;srcDraw(g,c.below,R);
  const L=doc.layers[doc.active];
  if(L&&L.visible){g.globalAlpha=L.opacity;srcDraw(g,L.canvas,R);
    if(ST.active&&ST.useBuf&&ST.doc===doc&&ST.layerIdx===doc.active){g.globalAlpha=L.opacity*ST.op;srcDraw(g,doc.preview,R);}}
  g.globalAlpha=1;srcDraw(g,c.above,R);
  g.globalAlpha=1;
}
function visRect(doc){const v=doc.view,W=cv.width/DPR,H=cv.height/DPR;
  const x0=clamp(-v.x/v.z-2,0,doc.w),y0=clamp(-v.y/v.z-2,0,doc.h),x1=clamp((W-v.x)/v.z+2,0,doc.w),y1=clamp((H-v.y)/v.z+2,0,doc.h);
  return{x:Math.floor(x0),y:Math.floor(y0),w:Math.max(1,Math.ceil(x1-x0)),h:Math.max(1,Math.ceil(y1-y0))};}
function srcDraw(t,src,R){if(R)t.drawImage(src,R.x,R.y,R.w,R.h,R.x,R.y,R.w,R.h);else t.drawImage(src,0,0);}
function drawLayers(g,doc,live){
  const R=live&&VIS&&!(MOVE&&MOVE.on)?VIS:null;
  for(let i=0;i<doc.layers.length;i++){
    const L=doc.layers[i];if(!L.visible)continue;
    const overlay=live&&ST.active&&ST.useBuf&&ST.doc===doc&&ST.layerIdx===i;
    const mv=live&&layerTransformFor(doc,i);
    const base=(t,a,RR)=>{srcDraw(t,L.canvas,RR);if(overlay){t.globalAlpha=a*ST.op;srcDraw(t,doc.preview,RR);t.globalAlpha=a;}};
    if(L.clip&&i>0){
      let b=i-1;while(b>0&&doc.layers[b].clip)b--;
      const t=clipTmp(doc),tg=t.getContext('2d');
      tg.globalCompositeOperation='source-over';tg.globalAlpha=1;tg.clearRect(0,0,doc.w,doc.h);
      base(tg,1);tg.globalCompositeOperation='destination-in';tg.drawImage(doc.layers[b].canvas,0,0);tg.globalCompositeOperation='source-over';
      g.globalAlpha=L.opacity;g.globalCompositeOperation=L.blend;g.drawImage(t,0,0);
    }else{
      g.globalAlpha=L.opacity;g.globalCompositeOperation=L.blend;
      if(mv){g.save();applyMoveTransform(g,doc);base(g,L.opacity,null);g.restore();}else base(g,L.opacity,R);
    }
  }
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}
function drawDoc(g,doc,opt){opt=opt||{};
  if(opt.bg!==false&&doc.bg.visible){g.fillStyle=doc.bg.color;g.fillRect(0,0,doc.w,doc.h);}
  drawLayers(g,doc,false);}

/* ============ simetri ============ */
function mulMat(A,B){return[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];}
function symMats(doc){
  const w=doc.w,hh=doc.h,m=[[1,0,0,1,0,0]],mir=[-1,0,0,1,w,0];
  if(S.sym==='mirror')m.push(mir);
  else if(S.sym==='mirror4'){m.push(mir,[1,0,0,-1,0,hh],[-1,0,0,-1,w,hh]);}
  else if(S.sym==='radial'||S.sym==='radialm'){
    const n=S.symN,x0=w/2,y0=hh/2;
    for(let k=0;k<n;k++){const a=Math.PI*2*k/n,c=Math.cos(a),s=Math.sin(a);
      const R=[c,s,-s,c,x0-c*x0+s*y0,y0-s*x0-c*y0];
      if(k>0)m.push(R);
      if(S.sym==='radialm')m.push(mulMat(R,mir));}
  }
  return m;
}
function withWrap(doc,g,fn){
  if(!doc.wrap){fn();return;}
  for(const ox of[-doc.w,0,doc.w])for(const oy of[-doc.h,0,doc.h]){g.save();g.translate(ox,oy);fn();g.restore();}
}

const BRUSHES={

  fine:{n:'Teknik kalem',sp:.06,min:1,kind:'hard',press:'none'},

function loadCustomBrushes(){try{const a=JSON.parse(localStorage.getItem('moda.brushes')||'[]');a.forEach(b=>{if(b&&b.key&&b.def)BRUSHES[b.key]=Object.assign({},b.def,{n:b.def.n,custom:true});});}catch(e){}}

const curBrush=()=>BRUSHES[S.brush]||BRUSHES.pen;
const rgbs=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

function pressFactor(B,p){
  if(!ST.pen||S.pressure<=0)return{s:1,a:1};
  const q=Math.pow(clamp(p,.02,1),.85);let s=1,a=1;
  if(B.press==='size'||B.press==='both')s=lerp(1,lerp(B.min,1,q),S.pressure);

  return{s,a};
}
function dabSize(B,p){return Math.max(.5,(ST.kind==='erase'?S.esize:S.size)*pressFactor(B,p).s);}

function drawDab(g,x,y,p,B,ang){
  const f=pressFactor(B,p),size=dabSize(B,p),r=size/2;
  const col=ST.col,erase=ST.kind==='erase';
  const hd=erase?S.hardness:S.hardness;
  bb(x,y,r+2);
  if(B.kind==='hard'&&(hd>=.95||erase&&hd>=.95)||(B.kind==='hard'&&!erase&&B.flat!=null)){
    g.fillStyle=rgbs(col,(B.flat||1)*f.a);g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();return;}
  if(B.kind==='hard'&&!erase){
    const gr=g.createRadialGradient(x,y,0,x,y,r);const h2=clamp(hd,.05,.98);
    gr.addColorStop(0,rgbs(col,f.a));gr.addColorStop(h2,rgbs(col,f.a));gr.addColorStop(1,rgbs(col,0));
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();return;}
  if(B.kind==='soft'||erase){
    const a=(erase?1:B.a)*f.a;const h2=B.soft?0:clamp(hd*.6,0,.9);
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,rgbs(col,a));gr.addColorStop(h2,rgbs(col,a));gr.addColorStop(1,rgbs(col,0));
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();return;}
  if(B.kind==='nib'){
    g.fillStyle=rgbs(col,f.a);g.beginPath();g.ellipse(x,y,r,Math.max(.6,r*.26),-.62,0,6.2832);g.fill();return;}
  if(B.kind==='grain'){
    const n=Math.round(clamp(r*B.dots,5,150));
    for(let i=0;i<n;i++){const a=Math.random()*6.2832,d=Math.sqrt(Math.random())*r;
      const sz=Math.max(.6,(Math.random()*.9+.35)*Math.max(1,size*.045));
      g.fillStyle=rgbs(col,B.a*f.a*(.35+Math.random()*.65));
      g.fillRect(x+Math.cos(a)*d,y+Math.sin(a)*d,sz,sz);}
  }
}
function bb(x,y,r){const b=ST.bb;if(x-r<b.x0)b.x0=x-r;if(y-r<b.y0)b.y0=y-r;if(x+r>b.x1)b.x1=x+r;if(y+r>b.y1)b.y1=y+r;}

/* motifler (damga) */
function motifPath(g,id,r){
  g.beginPath();
  const poly=(pts)=>{pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();};
  const petals=(n,len,wid)=>{for(let i=0;i<n;i++){const a=i*Math.PI*2/n;g.save();g.rotate(a);g.moveTo(0,0);g.bezierCurveTo(wid*r,-len*.3*r,wid*r,-len*.9*r,0,-len*r);g.bezierCurveTo(-wid*r,-len*.9*r,-wid*r,-len*.3*r,0,0);g.restore();}};
  switch(id){
    case'dot':g.arc(0,0,r,0,6.2832);break;
    case'ring':g.arc(0,0,r,0,6.2832);g.moveTo(r*.6,0);g.arc(0,0,r*.6,0,6.2832,true);break;
    case'flower5':petals(5,1,.55);break;
    case'flower8':petals(8,1,.3);break;
    case'daisy':petals(12,1,.2);break;
    case'tulip':g.moveTo(0,r);g.bezierCurveTo(-r*.9,r*.7,-r*.8,-r*.4,-r*.55,-r*.9);g.lineTo(-r*.25,-r*.4);g.lineTo(0,-r);g.lineTo(r*.25,-r*.4);g.lineTo(r*.55,-r*.9);g.bezierCurveTo(r*.8,-r*.4,r*.9,r*.7,0,r);break;
    case'leaf':g.moveTo(0,r);g.bezierCurveTo(r*.9,r*.3,r*.7,-r*.7,0,-r);g.bezierCurveTo(-r*.7,-r*.7,-r*.9,r*.3,0,r);break;
    case'star':{const q=[];for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.42:r;q.push([Math.cos(a)*rr,Math.sin(a)*rr]);}poly(q);break;}
    case'star4':{const q=[];for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.28:r;q.push([Math.cos(a)*rr,Math.sin(a)*rr]);}poly(q);break;}
    case'heart':g.moveTo(0,r*.9);g.bezierCurveTo(-r*1.3,r*.1,-r*.9,-r*.9,0,-r*.35);g.bezierCurveTo(r*.9,-r*.9,r*1.3,r*.1,0,r*.9);break;
    case'diamond':poly([[0,-r],[r*.7,0],[0,r],[-r*.7,0]]);break;
    case'cross':{const a=r*.32;poly([[-a,-r],[a,-r],[a,-a],[r,-a],[r,a],[a,a],[a,r],[-a,r],[-a,a],[-r,a],[-r,-a],[-a,-a]]);break;}
    case'tri':poly([[0,-r],[r*.9,r*.7],[-r*.9,r*.7]]);break;
    case'wave':g.moveTo(-r,0);g.bezierCurveTo(-r*.6,-r*.9,-r*.2,-r*.9,0,0);g.bezierCurveTo(r*.2,r*.9,r*.6,r*.9,r,0);g.lineTo(r,r*.3);g.bezierCurveTo(r*.6,r*1.2,r*.2,r*1.2,0,r*.3);g.bezierCurveTo(-r*.2,-r*.6,-r*.6,-r*.6,-r,r*.3);break;
    case'paisley':g.moveTo(0,r);g.bezierCurveTo(-r*.95,r*.7,-r*.9,-r*.3,-r*.1,-r);g.bezierCurveTo(r*.6,-r*.8,r*.9,-r*.1,r*.6,r*.5);g.bezierCurveTo(r*.45,r*.85,r*.2,r*.95,0,r);break;
    case'cherry':g.arc(-r*.4,r*.45,r*.5,0,6.2832);g.moveTo(r*.9,r*.45);g.arc(r*.4,r*.45,r*.5,0,6.2832);break;
    case'bar':poly([[-r,-r*.16],[r,-r*.16],[r,r*.16],[-r,r*.16]]);break;
    case'chevron':poly([[-r,r*.2],[0,-r*.5],[r,r*.2],[r,r*.6],[0,-r*.1],[-r,r*.6]]);break;
    case'snow':for(let i=0;i<6;i++){g.save();g.rotate(i*Math.PI/3);g.rect(-r*.07,-r,r*.14,r);g.rect(-r*.3,-r*.7,r*.6,r*.1);g.restore();}break;
    case'moon':g.arc(0,0,r,Math.PI*.2,Math.PI*1.8);g.arc(r*.35,-r*.05,r*.78,Math.PI*1.7,Math.PI*.3,true);break;
  }
}
const MOTIFS=[['dot','Nokta'],['ring','Halka'],['flower5','Çiçek 5'],['flower8','Çiçek 8'],['daisy','Papatya'],['tulip','Lale'],['leaf','Yaprak'],['star','Yıldız'],['star4','Işıltı'],['heart','Kalp'],['diamond','Baklava'],['cross','Artı'],['tri','Üçgen'],['wave','Dalga'],['paisley','Şal deseni'],['cherry','Kiraz'],['bar','Çizgi'],['chevron','Zikzak'],['snow','Kar tanesi'],['moon','Ay']];
function stampMotif(g,x,y,size,rot,c1,c2){
  g.save();g.translate(x,y);g.rotate(rot);
  const id=S.stamp.motif;motifPath(g,id,size/2);
  g.fillStyle=c1;g.fill('evenodd');
  if(S.stamp.centre&&['flower5','flower8','daisy'].includes(id)){g.beginPath();g.arc(0,0,size*.12,0,6.2832);g.fillStyle=c2;g.fill();}
  g.restore();

/* ============ vuruş (fırça / silgi / damga) ============ */
const ST={active:false,pen:false,kind:'draw'};
const PT=new Map();let GEST=null,spaceDown=false;
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),ms||1800);}
function layerOK(doc,quiet){const L=doc.layers[doc.active];
  if(!L){if(!quiet)toast('Katman yok. Katmanlar sekmesinden ekle.');return null;}
  if(!L.visible){if(!quiet)toast('Bu katman gizli.');return null;}
  if(L.locked){if(!quiet)toast('Bu katman kilitli.');return null;}
  if(L.isVec&&S.tool!=='shape'){if(!quiet)toast('Vektör katmanında yalnızca Şekil aracı çalışır.');return null;}
  return L;}
function strokeStart(x,y,p,e,kind){
  const doc=D(),L=layerOK(doc);if(!L)return false;
  Object.assign(ST,{active:true,doc,layerIdx:doc.active,kind,pen:e.pointerType==='pen',useBuf:kind!=='erase',op:S.opacity,first:true,rem:0,k:0,
    mats:symMats(doc),bb:{x0:1e9,y0:1e9,x1:-1e9,y1:-1e9},col:hex2rgb(S.fg),col2:hex2rgb(S.bg),sx:x,sy:y,sp:p,ang:0,lx:x,ly:y,lp:p});
  if(kind==='erase'){doc.bctx.clearRect(0,0,doc.w,doc.h);doc.bctx.drawImage(L.canvas,0,0);}
  else{doc.pctx.setTransform(1,0,0,1,0,0);doc.pctx.clearRect(0,0,doc.w,doc.h);}
  strokePoint(x,y,p,true);return true;
}
function targetCtx(){return ST.kind==='erase'?ST.doc.layers[ST.layerIdx].ctx:ST.doc.pctx;}
function placeAt(x,y,p,ang){
  const doc=ST.doc,g=targetCtx(),B=curBrush();
  for(const M of ST.mats){
    const X=M[0]*x+M[2]*y+M[4],Y=M[1]*x+M[3]*y+M[5];
    let a=ang;if(ST.kind==='stamp'||ST.kind==='trim')a=ang*(M[0]*M[3]-M[1]*M[2]>0?1:-1)+Math.atan2(M[1],M[0]);
    const r=(ST.kind==='stamp'?S.stamp.size:ST.kind==='trim'?S.trim.size*1.4:dabSize(B,p))/2+3;
    const xs=[X],ys=[Y];
    if(doc.wrap){if(X<r)xs.push(X+doc.w);if(X>doc.w-r)xs.push(X-doc.w);if(Y<r)ys.push(Y+doc.h);if(Y>doc.h-r)ys.push(Y-doc.h);}
    for(const xx of xs)for(const yy of ys){
      if(ST.kind==='erase'){g.save();g.globalCompositeOperation='destination-out';drawDab(g,xx,yy,p,B);g.restore();}
      else if(ST.kind==='stamp'){const sz=S.stamp.size*(1+(Math.random()*2-1)*S.stamp.sizeJit);bb(xx,yy,sz*.75);
        stampMotif(g,xx,yy,sz,a,rgbs(ST.col,1),rgbs(ST.col2,1));}
      else if(ST.kind==='trim'){const t=S.trim,sz=t.size*(1+(Math.random()*2-1)*t.sizeJit);bb(xx,yy,sz*.8);
        g.save();if(t.flip&&ST.k%2)g.scale(1,1);drawTrim(g,t.kind,xx,yy,sz,a,S.fg,t.natural,t.shadow,ST.k,rng(ST.k*77+13));g.restore();ST.k++;}
      else drawDab(g,xx,yy,p,B);}
  }
}
function strokePoint(rx,ry,rp,first){
  const B=curBrush();
  if(!first){const k=ST.kind==='stamp'?1:1-S.smooth*.88;ST.sx+=(rx-ST.sx)*k;ST.sy+=(ry-ST.sy)*k;ST.sp+=(rp-ST.sp)*.5;}
  else{ST.sx=rx;ST.sy=ry;ST.sp=rp;}
  strokeTo(ST.sx,ST.sy,ST.sp,B);ST.rx=rx;ST.ry=ry;ST.rp=rp;
}
const TRIM_FOLLOW=['zipper','lace','ruffle','fringe','ribbon','piping','chain','stitch','zigzag','satin','crossst','pearl2'];
function trimDef(){return TRIMS.find(t=>t.id===S.trim.kind)||TRIMS[0];}
function trimStep(){return Math.max(2,S.trim.size*trimDef().gap*S.trim.gapMul);}
function trimRot(){const f=TRIM_FOLLOW.includes(S.trim.kind);return f?ST.ang:(S.trim.kind==='bow'||S.trim.kind==='rose'||S.trim.kind==='flower'||S.trim.kind==='leaf'?(Math.random()*2-1)*.5:0);}
function strokeTo(x,y,p,B){
  const isStamp=ST.kind==='stamp',isTrim=ST.kind==='trim',isSp=isStamp||isTrim;
  const stepAt=q=>isTrim?trimStep():isStamp?Math.max(3,S.stamp.size*S.stamp.gap):Math.max(.7,dabSize(B,q)*B.sp*(ST.kind==='erase'?1.2:1));
  const rotFor=()=>{if(isTrim)return trimRot();const base=S.stamp.follow?ST.ang+Math.PI/2:0;return base+(Math.random()*2-1)*S.stamp.rotJit*Math.PI;};
  if(ST.first){ST.first=false;placeAt(x,y,p,isSp?rotFor():0);ST.lx=x;ST.ly=y;ST.lp=p;ST.rem=stepAt(p);invalidate();return;}
  const dx=x-ST.lx,dy=y-ST.ly,dist=Math.hypot(dx,dy);if(dist<.05)return;
  if(dist>3)ST.ang=Math.atan2(dy,dx);
  let pos=ST.rem,guard=0;
  while(pos<=dist&&guard++<4000){const t=pos/dist,q=lerp(ST.lp,p,t);placeAt(lerp(ST.lx,x,t),lerp(ST.ly,y,t),q,isSp?rotFor():0);pos+=stepAt(q);}
  ST.rem=pos-dist;ST.lx=x;ST.ly=y;ST.lp=p;invalidate();
}
function strokeEnd(){
  if(!ST.active)return;
  if(ST.rx!=null&&ST.kind!=='stamp'&&ST.kind!=='trim')strokeTo(ST.rx,ST.ry,ST.rp,curBrush());
  const doc=ST.doc,L=doc.layers[ST.layerIdx];ST.active=false;
  const b=ST.bb;if(b.x1<b.x0||!L){invalidate();return;}
  const x=Math.max(0,Math.floor(b.x0)),y=Math.max(0,Math.floor(b.y0)),w=Math.min(doc.w,Math.ceil(b.x1))-x,hh=Math.min(doc.h,Math.ceil(b.y1))-y;
  if(w<=0||hh<=0){invalidate();return;}
  if(ST.kind==='erase'){const before=doc.bctx.getImageData(x,y,w,hh);

    pxEntry(doc,L,x,y,w,hh,before);}

    const before=L.ctx.getImageData(x,y,w,hh);
    L.ctx.save();L.ctx.globalAlpha=ST.op;L.ctx.globalCompositeOperation=L.alphaLock?'source-atop':'source-over';
    if(SEL.mask){const t=newCanvas(w,hh),tg=t.getContext('2d');tg.drawImage(doc.preview,x,y,w,hh,0,0,w,hh);selMaskCanvas(t,x,y);L.ctx.drawImage(t,x,y);}
    else L.ctx.drawImage(doc.preview,x,y,w,hh,x,y,w,hh);L.ctx.restore();
    pxEntry(doc,L,x,y,w,hh,before);doc.pctx.clearRect(x,y,w,hh);
  }
  S.lastEnd={x:ST.rx,y:ST.ry,doc};
  S.recent=S.recent.filter(c=>c!==S.fg);S.recent.unshift(S.fg);S.recent.length=Math.min(S.recent.length,16);
  invalidate();refreshLayerThumb(doc.layers.indexOf(L));if(S.mode==='pattern')drawPrev();
}
function cancelTransient(){
  if(ST.active){ST.active=false;const d=ST.doc;if(ST.kind==='erase'&&d){const L=d.layers[ST.layerIdx];if(L){L.ctx.globalCompositeOperation='source-over';L.ctx.clearRect(0,0,d.w,d.h);L.ctx.drawImage(d.backup,0,0);}}else if(d)d.pctx.clearRect(0,0,d.w,d.h);}

/* ============ dolgu (kova) ============ */
function sampleImage(doc,mode){
  if(mode==='layer')return doc.layers[doc.active].ctx.getImageData(0,0,doc.w,doc.h);
  const t=newCanvas(doc.w,doc.h),g=t.getContext('2d');drawDoc(g,doc,{bg:true});return g.getImageData(0,0,doc.w,doc.h);
}
function floodMask(img,w,hh,sx,sy,tol){
  const d=img.data,k0=(sy*w+sx)*4,r0=d[k0],g0=d[k0+1],b0=d[k0+2],a0=d[k0+3];
  const test=p=>{const k=p*4;return Math.abs(d[k]-r0)<=tol&&Math.abs(d[k+1]-g0)<=tol&&Math.abs(d[k+2]-b0)<=tol&&Math.abs(d[k+3]-a0)<=tol;};
  const mask=new Uint8Array(w*hh),stack=[sx,sy];
  while(stack.length){
    const y=stack.pop(),x=stack.pop(),row=y*w;
    if(mask[row+x]||!test(row+x))continue;
    let xl=x;while(xl>0&&!mask[row+xl-1]&&test(row+xl-1))xl--;
    let xr=x;while(xr<w-1&&!mask[row+xr+1]&&test(row+xr+1))xr++;
    for(let i=xl;i<=xr;i++)mask[row+i]=1;
    for(const dy of[-1,1]){const yy=y+dy;if(yy<0||yy>=hh)continue;let inS=false;
      for(let i=xl;i<=xr;i++){const q=yy*w+i,ok=!mask[q]&&test(q);if(ok&&!inS){stack.push(i,yy);inS=true;}else if(!ok)inS=false;}}
  }
  return mask;
}
function growMask(mask,w,hh,g){
  for(let k=0;k<g;k++){const src=mask.slice();
    for(let y=0;y<hh;y++){const row=y*w;for(let x=0;x<w;x++){const p=row+x;if(src[p])continue;
      if((x>0&&src[p-1])||(x<w-1&&src[p+1])||(y>0&&src[p-w])||(y<hh-1&&src[p+w]))mask[p]=1;}}}
}
function doFill(x,y){
  const doc=D(),L=layerOK(doc);if(!L)return;
  x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=doc.w||y>=doc.h)return;
  toast('Boyanıyor…',900);
  setTimeout(()=>{
    const img=sampleImage(doc,S.fill.sample),mask=floodMask(img,doc.w,doc.h,x,y,S.fill.tol*1.5);
    if(S.fill.grow)growMask(mask,doc.w,doc.h,S.fill.grow);
    let x0=1e9,y0=1e9,x1=-1,y1=-1;
    for(let j=0;j<doc.h;j++){const row=j*doc.w;for(let i=0;i<doc.w;i++)if(mask[row+i]){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j;}}
    if(x1<0)return;
    const bw=x1-x0+1,bh=y1-y0+1,m=newCanvas(bw,bh),mg=m.getContext('2d'),id=mg.createImageData(bw,bh);
    for(let j=0;j<bh;j++)for(let i=0;i<bw;i++)if(mask[(y0+j)*doc.w+x0+i])id.data[(j*bw+i)*4+3]=255;
    mg.putImageData(id,0,0);
    const c=newCanvas(bw,bh),g=c.getContext('2d');
    if(S.fill.src==='pattern'){const pt=currentPatternCanvas();
      if(pt){const pat=g.createPattern(pt,'repeat');pat.setTransform(new DOMMatrix().translate(-x0,-y0).rotate(S.pat.fillRot).scale(S.pat.fillScale));g.fillStyle=pat;}
      else{toast('Önce Desenler sekmesinden bir desen seç.');return;}}
    else if(S.fill.src==='gradient'){const a=S.fill.angle*Math.PI/180,cxx=bw/2,cyy=bh/2,rr=(Math.abs(Math.cos(a))*bw+Math.abs(Math.sin(a))*bh)/2;
      const gr=g.createLinearGradient(cxx-Math.cos(a)*rr,cyy-Math.sin(a)*rr,cxx+Math.cos(a)*rr,cyy+Math.sin(a)*rr);gr.addColorStop(0,S.fg);gr.addColorStop(1,S.bg);g.fillStyle=gr;}
    else g.fillStyle=S.fg;
    g.fillRect(0,0,bw,bh);if(S.fill.drape&&S.fill.drape!=='none')applyDrape(g,bw,bh,S.fill.drape);g.globalCompositeOperation='destination-in';g.drawImage(m,0,0);
    if(SEL.mask)selMaskCanvas(c,x0,y0);
    const before=L.ctx.getImageData(x0,y0,bw,bh);
    L.ctx.save();L.ctx.globalAlpha=S.opacity;L.ctx.globalCompositeOperation=L.alphaLock?'source-atop':'source-over';L.ctx.drawImage(c,x0,y0);L.ctx.restore();
    pxEntry(doc,L,x0,y0,bw,bh,before);invalidate();refreshLayerThumb(doc.active);if(S.mode==='pattern')drawPrev();
  },20);
}

/* ===== Canlı boya: kalıcı bölgeler ===== */
function liveLayer(doc){let L=doc.layers.find(l=>l.live);
  if(!L){const n=doc.layers.length;addLayer('Canlı boya');if(doc.layers.length===n)return null;L=doc.layers[doc.active];L.live=true;L.regions=[];
    /* boya çizgilerin altında kalsın: 'Çizgi' katmanının hemen altına (yoksa manken üstüne) yerleştir */
    const cur=doc.layers.indexOf(L),ci=doc.layers.findIndex(l=>!l.live&&l!==L&&l.name==='Çizgi'),fi=doc.layers.findIndex(l=>l.tag==='figure');
    let to=ci>=0?ci:(fi>=0?fi+1:0);if(cur>to){doc.layers.splice(cur,1);doc.layers.splice(to,0,L);}
    doc.active=doc.layers.indexOf(L);}
  if(!L.regions)L.regions=[];return L;}
function lineComposite(doc){const t=newCanvas(doc.w,doc.h),g=t.getContext('2d');
  for(const l of doc.layers){if(l.live||!l.visible)continue;g.drawImage(l.canvas,0,0);}return t;}
function maskToCanvas(doc,mask,col){const c=newCanvas(doc.w,doc.h),g=c.getContext('2d'),id=g.createImageData(doc.w,doc.h),d=id.data;
  for(let i=0;i<mask.length;i++)if(mask[i]){const k=i*4;d[k+3]=255;}
  g.putImageData(id,0,0);
  if(col){g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,doc.w,doc.h);}
  return c;}
function liveRestore(LV,snap){LV.ctx.clearRect(0,0,LV.canvas.width,LV.canvas.height);LV.ctx.drawImage(snap.canvas,0,0);LV.regions=JSON.parse(JSON.stringify(snap.regions));invalidate();renderSide();}
function liveBucket(doc,x,y){
  x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=doc.w||y>=doc.h)return;
  const LV=liveLayer(doc);if(!LV)return;if(LV.locked||!LV.visible){toast('Canlı boya katmanı kilitli ya da gizli.');return;}
  const comp=lineComposite(doc),mask=floodMask(comp.getContext('2d').getImageData(0,0,doc.w,doc.h),doc.w,doc.h,x,y,S.fill.tol*1.5);
  if(!mask||!mask[y*doc.w+x]){toast('Bu noktada bölge bulunamadı.');return;}
  const snapOf=()=>{const c=newCanvas(doc.w,doc.h);c.getContext('2d').drawImage(LV.canvas,0,0);return{canvas:c,regions:JSON.parse(JSON.stringify(LV.regions))};};
  const before=snapOf();
  const target=LV.regions.find(r=>mask[r.y*doc.w+r.x]);
  const fill=maskToCanvas(doc,mask,S.fg);
  if(target){LV.ctx.save();LV.ctx.globalCompositeOperation='destination-out';LV.ctx.drawImage(maskToCanvas(doc,mask,null),0,0);LV.ctx.restore();target.col=S.fg;}
  else LV.regions.push({x,y,col:S.fg});
  LV.ctx.save();LV.ctx.globalAlpha=S.opacity;LV.ctx.drawImage(fill,0,0);LV.ctx.restore();
  const after=snapOf();
  structEntry(doc,()=>liveRestore(LV,before),()=>liveRestore(LV,after),doc.w*doc.h*4*2);
  invalidate();renderSide();refreshLayerThumb(doc.active);}

/* damlalık */
function pickColor(x,y,commit){
  const doc=D();x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=doc.w||y>=doc.h)return;

/* ============ şekiller ============ */
function shapePath(g,sh){
  const x0=sh.x0,y0=sh.y0;let x1=sh.x1,y1=sh.y1;const m=S.shape.mode;
  g.beginPath();
  if(m==='line'){g.moveTo(x0,y0);g.lineTo(x1,y1);return;}
  let w=x1-x0,hh=y1-y0;
  if(sh.shift){const s=Math.max(Math.abs(w),Math.abs(hh));w=Math.sign(w||1)*s;hh=Math.sign(hh||1)*s;x1=x0+w;y1=y0+hh;}
  if(m==='rect')g.rect(x0,y0,w,hh);
  else if(m==='rrect'){const r=Math.min(Math.abs(w),Math.abs(hh))*.2;g.roundRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(w),Math.abs(hh),r);}
  else if(m==='ellipse')g.ellipse(x0+w/2,y0+hh/2,Math.abs(w)/2,Math.abs(hh)/2,0,0,6.2832);
  else if(m==='tri'){g.moveTo(x0+w/2,y0);g.lineTo(x1,y1);g.lineTo(x0,y1);g.closePath();}
}
function paintShape(g,sh,alpha){
  const sw=S.size,fm=S.shape.fill;
  g.save();g.globalAlpha=alpha;g.lineWidth=sw;g.lineCap='round';g.lineJoin='round';
  g.setLineDash(S.shape.dash?[sw*2.2,sw*2]:[]);
  shapePath(g,sh);
  if(S.shape.mode!=='line'&&(fm==='fill'||fm==='both')){g.fillStyle=fm==='both'?S.bg:S.fg;g.fill();}
  if(S.shape.mode==='line'||fm==='stroke'||fm==='both'){g.strokeStyle=S.fg;g.stroke();}
  g.restore();
}
function drawShapeSym(g,doc,sh,overlay){
  for(const M of symMats(doc)){g.save();g.transform(M[0],M[1],M[2],M[3],M[4],M[5]);paintShape(g,sh,overlay?.85:1);g.restore();}
}
var FREE=null;
function finishFree(){
  const F=FREE;FREE=null;const doc=D(),L=doc.layers[doc.active];
  if(!F||!L||!L.isVec||F.pts.length<3){invalidate();return;}
  const tol=2/doc.view.z;let pts=[F.pts[0]];
  for(const q of F.pts){const a=pts[pts.length-1];if(Math.hypot(q[0]-a[0],q[1]-a[1])>=tol)pts.push(q);}
  if(pts.length>160)pts=pts.filter((_,i)=>i%Math.ceil(pts.length/160)===0);
  const m=S.shape.fill;
  L.vec.push({kind:'poly',pts,fill:m==='stroke'?null:S.bg,stroke:m==='fill'?null:S.fg,sw:Math.max(1,S.size)});
  VSEL=L.vec.length-1;VSELS=[VSEL];renderSide();invalidate();markDirty();
  toast('Serbest şekil eklendi. Noktalarından düzenleyebilirsin.');
}

function kalipSaveList(a){try{localStorage.setItem('moda_kaliplar',JSON.stringify(a));return true;}catch(e){toast('Kalıp kaydedilemedi (tarayıcı depolaması kapalı).');return false;}}

function commitShape(){
  const doc=D(),L=layerOK(doc);const sh=SHAPE;SHAPE=null;if(!L||!sh)return;
  if(Math.hypot(sh.x1-sh.x0,sh.y1-sh.y0)<2){invalidate();return;}
  if(L.isVec){/* vektör katmanı: şekil listeye eklenir, tuval listeden yeniden çizilir (düzenlenebilir) */
    const fm=S.shape.fill,mode=S.shape.mode;
    const x0=Math.min(sh.x0,sh.x1),y0=Math.min(sh.y0,sh.y1),x1=Math.max(sh.x0,sh.x1),y1=Math.max(sh.y0,sh.y1);
    const s=mode==='line'?{kind:'line',pts:[[sh.x0,sh.y0],[sh.x1,sh.y1]]}:mode==='ellipse'?{kind:'ellipse',x:x0,y:y0,w:x1-x0,h:y1-y0}:mode==='tri'?{kind:'poly',pts:[[(x0+x1)/2,y0],[x1,y1],[x0,y1]]}:{kind:'rect',x:x0,y:y0,w:x1-x0,h:y1-y0};
    s.stroke=(mode==='line'||fm==='stroke'||fm==='both')?S.fg:null;s.fill=(mode!=='line'&&(fm==='fill'||fm==='both'))?(fm==='both'?S.bg:S.fg):null;s.sw=S.size;
    if(!s.stroke&&!s.fill)s.stroke=S.fg;
    const idx=L.vec.length;L.vec.push(s);vecRender(L);
    structEntry(doc,()=>{L.vec.splice(idx,1);vecRender(L);renderSide();},()=>{L.vec.splice(idx,0,s);vecRender(L);renderSide();},0);
    invalidate();renderSide();return;}
  const x=0,y=0,w=doc.w,hh=doc.h;let bx=x,by=y,bw=w,bh=hh;
  if(S.sym==='none'&&!doc.wrap){const pad=S.size+4;bx=Math.max(0,Math.floor(Math.min(sh.x0,sh.x1)-pad));by=Math.max(0,Math.floor(Math.min(sh.y0,sh.y1)-pad));
    bw=Math.min(w,Math.ceil(Math.max(sh.x0,sh.x1)+pad))-bx;bh=Math.min(hh,Math.ceil(Math.max(sh.y0,sh.y1)+pad))-by;}
  if(bw<=0||bh<=0)return;
  const before=L.ctx.getImageData(bx,by,bw,bh);
  const t=newCanvas(w,hh),tg=t.getContext('2d');withWrap(doc,tg,()=>drawShapeSym(tg,doc,sh,false));
  if(SEL.mask)selMaskCanvas(t,0,0);
  L.ctx.save();L.ctx.globalAlpha=S.opacity;L.ctx.globalCompositeOperation=L.alphaLock?'source-atop':'source-over';L.ctx.drawImage(t,bx,by,bw,bh,bx,by,bw,bh);L.ctx.restore();
  pxEntry(doc,L,bx,by,bw,bh,before);invalidate();refreshLayerThumb(doc.active);if(S.mode==='pattern')drawPrev();
}

/* ============ eğri (kalem aracı) ============ */
function pathSmooth(g,pts,closed,t){
  const n=pts.length;if(n<2)return;g.moveTo(pts[0].x,pts[0].y);
  const get=i=>closed?pts[(i%n+n)%n]:pts[clamp(i,0,n-1)],m=closed?n:n-1;
  for(let i=0;i<m;i++){const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);
    g.bezierCurveTo(p1.x+(p2.x-p0.x)/6*t,p1.y+(p2.y-p0.y)/6*t,p2.x-(p3.x-p1.x)/6*t,p2.y-(p3.y-p1.y)/6*t,p2.x,p2.y);}
  if(closed)g.closePath();
}
function drawCurveOverlay(g,doc){
  const z=doc.view.z;g.save();g.lineWidth=Math.max(1.5/z,S.size*.5);g.lineCap='round';g.strokeStyle=cssC.acc;g.globalAlpha=.75;
  g.beginPath();pathSmooth(g,CURVE.pts,CURVE.closed,S.curve.smooth?1:0);g.stroke();g.globalAlpha=1;
  CURVE.pts.forEach((p,i)=>{g.fillStyle=i===0?cssC.acc:'#fff';g.strokeStyle=cssC.acc;g.lineWidth=2/z;const r=7/z;g.beginPath();g.rect(p.x-r,p.y-r,r*2,r*2);g.fill();g.stroke();});
  g.restore();
}
function commitCurve(fill){
  const doc=D(),L=layerOK(doc);if(!L||CURVE.pts.length<2){toast('En az iki nokta koy.');return;}
  const pts=CURVE.pts.map(p=>({x:p.x,y:p.y})),closed=CURVE.closed||fill;
  const before=fullSnap(L);
  const t=newCanvas(doc.w,doc.h),g=t.getContext('2d');
  withWrap(doc,g,()=>{for(const M of symMats(doc)){g.save();g.transform(...M);
    g.lineWidth=S.size;g.lineCap='round';g.lineJoin='round';g.setLineDash(S.shape.dash?[S.size*2.2,S.size*2]:[]);
    g.beginPath();pathSmooth(g,pts,closed,S.curve.smooth?1:0);
    if(fill){g.fillStyle=S.bg;g.fill();}g.strokeStyle=S.fg;g.stroke();g.restore();}});
  if(SEL.mask)selMaskCanvas(t,0,0);
  L.ctx.save();L.ctx.globalAlpha=S.opacity;L.ctx.globalCompositeOperation=L.alphaLock?'source-atop':'source-over';L.ctx.drawImage(t,0,0);L.ctx.restore();
  const after=fullSnap(L);
  histPush(doc,{t:'px',layer:L.id,x:0,y:0,w:doc.w,h:doc.h,before,after,bytes:doc.w*doc.h*8});
  CURVE.pts=[];CURVE.closed=false;renderFloat();invalidate();refreshLayerThumb(doc.active);if(S.mode==='pattern')drawPrev();
}

/* ============ taşı / dönüştür ============ */
function resetMove(){MOVE.dup=false;MOVE.on=false;MOVE.dx=MOVE.dy=0;MOVE.s=1;MOVE.rot=0;MOVE.flip=false;MOVE.persp=false;MOVE.pc=null;MOVE.pdrag=-1;WG.on=false;WG.pts=null;WG.drag=-1;invalidate();renderFloat();}
function startMove(){const doc=D();MOVE.on=true;MOVE.px=doc.w/2;MOVE.py=doc.h/2;MOVE.dx=MOVE.dy=0;MOVE.s=1;MOVE.rot=0;MOVE.flip=false;renderFloat();invalidate();}
/* ---- perspektif (dört köşe) dönüştürme ---- */
function solveLin(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){let piv=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[piv][c]))piv=r;[M[c],M[piv]]=[M[piv],M[c]];

  const mids=(arr,n)=>{const out=[];for(let i=0;i<arr.length-1;i++)out.push(...lerpPts(arr[i],arr[i+1],n).slice(i?1:0));return out;};
  if(!back){

    for(const s of[-1,1]){path3(mids([[s*.12,1.42],[s*.3,1.4],[s*.52,1.5]],4),false);}

    else if(male||kid){for(const s of[-1,1])path3(mids([[s*.5,2.3],[s*.3,2.45],[s*.04,2.38]],4),false);if(male){path3(mids([[0,2.5],[0,3.2]],6),false);}}
    {const q=surf(0,3.35,false);if(q.vis){const p=px(q.p);g.beginPath();g.arc(p[0],p[1],u*.02,0,6.2832);g.stroke();}}
  }else{
    for(const s of[-1,1])path3(mids([[s*.12,1.9],[s*.32,2.05],[s*.5,1.95]],4),true);

    for(const s of[-1,1])path3(mids([[s*.05,3.95],[s*.45,4.0],[s*.55,4.3]],4),true);
  }
  /* diz çizgileri */
  for(const L of G.legs){const z=L.zK,xx=(L.K[0])*cy+z*sy;
    if(cy>.25){g.beginPath();const a=px([xx-.1*L.s*0-.09,L.K[1]+.04]),b=px([xx,L.K[1]+.1]),c2=px([xx+.09,L.K[1]+.04]);g.moveTo(a[0],a[1]);g.quadraticCurveTo(b[0],b[1],c2[0],c2[1]);g.stroke();}}
  /* kulak + yüz */
  const eyeY=.47+(kid?.08:0),faceOn=f.face===true||f.face==='sade';
  const hsurf=(xl,yl)=>{const a=HEAD.A(yl)*hs2,xi=clamp(xl/a,-1,1),ze=Math.sqrt(1-xi*xi),z=HEAD.F(yl)*ze;
    return{p:[hx*cy+xl*cy+z*sy,yl],vis:(-xi/a*sy+ze/HEAD.F(yl)*cy)>.03};};
  if(Math.abs(sy)>.2){const e=sy>0?1:-1,ex=e*HEAD.A(.5)*hs2,cs=[[-.1,.42],[-.02,.38],[.06,.43],[.06,.55],[-.03,.62],[-.1,.55]].map(p=>px([hx*cy+ex*cy+p[0]*sy*e*-1*-1,p[1]]));
    // kulak: yanda görünen yüzey üstünde küçük kıvrım
    g.beginPath();pathSmooth(g,cs.map(p=>({x:p[0],y:p[1]})),true,1);g.fillStyle=fillCol;g.fill();g.lineWidth=outline*.7;g.strokeStyle=INK;g.stroke();}
  g.lineWidth=outline*.8;g.strokeStyle='rgba(42,46,53,.82)';
  if(faceOn&&cy>-.1){
    for(const s of[-1,1]){
      lineV([hsurf(s*.07,eyeY),hsurf(s*.13,eyeY-.015),hsurf(s*.2,eyeY)].map(q=>q));
      lineV([hsurf(s*.05,eyeY-.1),hsurf(s*.14,eyeY-.125),hsurf(s*.24,eyeY-.1)]);
    }
    lineV([hsurf(0,eyeY+.02),hsurf(-.02,.6),hsurf(.03,.64)].map(q=>{const p=q.p;return{p:[p[0]+ (q.vis?0:0),p[1]],vis:q.vis};}));
    /* profilde burun çıkıntısı */
    if(Math.abs(sy)>.35){const e=sy>0?1:-1,p0=px([hx*cy+HEAD.F(.55)*sy*1.0+.0,.52]),p1=px([hx*cy+.54*sy,.62]),p2=px([hx*cy+HEAD.F(.68)*sy,.68]);
      g.beginPath();g.moveTo(p0[0],p0[1]);g.lineTo(p1[0],p1[1]);g.lineTo(p2[0],p2[1]);g.stroke();}
    const lipY=.78+(kid?.04:0),m=[hsurf(-.1,lipY),hsurf(0,lipY-.02),hsurf(.1,lipY),hsurf(0,lipY+.06)];
    if(m.every(q=>q.vis)){g.beginPath();pathSmooth(g,m.map(q=>PT(q.p)),true,1);g.fillStyle=kid?'#d0868c':'#b5555e';g.fill();}
    else lineV([hsurf(-.08,lipY),hsurf(0,lipY+.01),hsurf(.08,lipY)]);
  }
  /* ---- yapım çizgileri (kesikli, çıktıya dahil) ---- */
  if(construct){
    g.save();g.setLineDash([u*.05,u*.04]);g.lineWidth=Math.max(1,u*.008);g.strokeStyle='rgba(70,80,92,.75)';
    const ring=yt=>{const a=TS.A(yt),pts=[];for(let i=0;i<=18;i++)pts.push(surf(lerp(-a,a,i/18),yt,false));for(let i=0;i<=18;i++)pts.push(surf(lerp(a,-a,i/18),yt,true));return pts;};
    for(const yt of[1.56,2.3,3.05,3.95,4.5])lineV(ring(yt));
    const vlines=[[0,false],[0,true]];
    for(const[xx,bk]of vlines)lineV(Array.from({length:30},(_,i)=>surf(xx,lerp(1.28,4.52,i/29),bk)));
    for(const s of[-1,1])lineV(Array.from({length:30},(_,i)=>{const yt=lerp(1.6,3.95,i/29);return surf(s*TR.A(yt)*.995,yt,false);}));
    /* bacak ve kol eksenleri, diz hizası */
    for(const L of G.legs){const pts=[[L.Jt[0]*cy,L.Jt[1]],[L.K[0]*cy+L.zK*sy,L.K[1]],[L.A[0]*cy+L.zA*sy,L.A[1]]];g.beginPath();pts.forEach((p,i)=>{const q=px(p);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);});g.stroke();}
    for(const a of arms){g.beginPath();a.hj.forEach((p,i)=>{});const pts=[a.A.S0,a.A.E,a.A.W].map((p,i)=>[p[0]*cy+a.A.z[i]*sy,p[1]]);pts.forEach((p,i)=>{const q=px(p);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);});g.stroke();}
    {const kk=G.legs.map(L=>[L.K[0]*cy+L.zK*sy,L.K[1]]);const q0=px([Math.min(kk[0][0],kk[1][0])-.3,kk[0][1]]),q1=px([Math.max(kk[0][0],kk[1][0])+.3,kk[0][1]]);g.beginPath();g.moveTo(q0[0],q0[1]);g.lineTo(q1[0],q1[1]);g.stroke();}
    /* baş: ortak eksen, kaş, göz, burun, ağız hizaları */
    const hRing=yl=>{const pts=[];const a=HEAD.A(yl)*hs2;for(let i=0;i<=16;i++){const xl=lerp(-a,a,i/16),xi=xl/a,ze=Math.sqrt(1-xi*xi);pts.push({p:[hx*cy+xl*cy+HEAD.F(yl)*ze*sy,yl],vis:(-xi/a*sy+ze/HEAD.F(yl)*cy)>.02});}
      for(let i=0;i<=16;i++){const xl=lerp(a,-a,i/16),xi=xl/a,ze=Math.sqrt(1-xi*xi);pts.push({p:[hx*cy+xl*cy-HEAD.B(yl)*ze*sy,yl],vis:(-xi/a*sy-ze/HEAD.B(yl)*cy)>.02});}return pts;};
    for(const yl of[.12,eyeY,.7])lineV(hRing(yl));
    lineV(Array.from({length:12},(_,i)=>{const yl=lerp(.03,.98,i/11),a=HEAD.A(yl);return hsurf(0,yl);}));
    lineV(Array.from({length:12},(_,i)=>{const yl=lerp(.03,.98,i/11),a=HEAD.A(yl)*hs2,ze=1,z=-HEAD.B(yl);return{p:[hx*cy+z*sy,yl],vis:(-0*sy+(-1)*cy)>.02};}));
    g.restore();
  }
  /* parmaklar */
  g.lineWidth=outline*.6;g.strokeStyle='rgba(42,46,53,.7)';g.setLineDash([]);
  for(const a of arms){if(Math.abs(cy)<.3)continue;const[W0,H0]=a.hj,dx=H0[0]-W0[0],dyy=H0[1]-W0[1],m=Math.hypot(dx,dyy)||1,nx=-dyy/m,ny=dx/m,ww=.09*aw*a.hs;
    for(const k of[-.5,0,.5]){const p0=px([lerp(W0[0],H0[0],.5)+nx*ww*k,lerp(W0[1],H0[1],.5)+ny*ww*k]),p1=px([lerp(W0[0],H0[0],.93)+nx*ww*k*1.3,lerp(W0[1],H0[1],.93)+ny*ww*k*1.3]);g.beginPath();g.moveTo(p0[0],p0[1]);g.lineTo(p1[0],p1[1]);g.stroke();}
    /* başparmak */
    const med=-a.A.s*.05*aw*Math.sign(cy||1),t0=px([lerp(W0[0],H0[0],.12)+med,lerp(W0[1],H0[1],.12)]),t1=px([lerp(W0[0],H0[0],.5)+med*1.6,lerp(W0[1],H0[1],.5)]);
    g.beginPath();g.moveTo(t0[0],t0[1]);g.lineTo(t1[0],t1[1]);g.stroke();}

  if(hairOn){

    const pts=rr.concat([[hx*cy+(rr[rr.length-1][0]-hx*cy)*.5,Math.max(hl,cR*.55)],[hx*cy,hl],[hx*cy+(ll[ll.length-1][0]-hx*cy)*.5,Math.max(hl,cL*.55)]],ll.slice().reverse());

  }

  if(style==='manken'){const x0=px([-1.3,0])[0],x1=px([1.3,0])[0],gr=g.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,'rgba(0,0,0,.22)');gr.addColorStop(.35,'rgba(255,255,255,.18)');gr.addColorStop(.62,'rgba(0,0,0,.02)');gr.addColorStop(1,'rgba(0,0,0,.26)');

  g.restore();
}

function figureBounds(doc,n,i){
  const colW=doc.w/n,H=doc.h*(n>1?.86:.92),oy=(doc.h-H)/2;return{ox:colW*(i+.5),oy,H};
}
function buildFigureLayer(doc){
  const L=doc.layers.find(l=>l.tag==='figure');if(!L)return null;
  const n=doc.figN||1;L.ctx.clearRect(0,0,doc.w,doc.h);doc.figGeoms=[];
  for(let i=0;i<n;i++){const b=figureBounds(doc,n,i);
    const o=n>1?{pose:['agirlik','simetrik','podyum','yuruyus'][i%4]}:{};
    drawFigure(L.ctx,b.ox,b.oy,b.H,o,doc.figGeoms);}
  return L;
}
function rebuildGeoms(doc){
  if(!doc||!doc.layers.some(l=>l.tag==='figure'))return;
  const n=doc.figN||1;doc.figGeoms=[];
  for(let i=0;i<n;i++){const b=figureBounds(doc,n,i),o=n>1?{pose:['agirlik','simetrik','podyum','yuruyus'][i%4]}:{};doc.figGeoms.push(figGeom(o,b.ox,b.oy,b.H));}
}
function regenFigure(){
  const doc=DOCS.design;if(!doc)return;
  const L=doc.layers.find(l=>l.tag==='figure');
  if(!L){toast('Bu sayfada manken yok. Yeni sayfa açarken manken seçebilirsin.');return;}
  if(typeof garCommit==='function')garCommit();
  /* manken ve üzerindeki canlı kıyafetler tek geri alma adımında yenilenir */
  const ls=[L].concat(doc.layers.filter(l=>l.gar));
  const before=ls.map(l=>fullSnap(l));
  buildFigureLayer(doc);ls.slice(1).forEach(l=>garRender(doc,l));
  const after=ls.map(l=>fullSnap(l));
  histPush(doc,{t:'fn',undo:()=>{ls.forEach((l,i)=>l.ctx.putImageData(before[i],0,0));rebuildGeoms(doc);ls.slice(1).forEach(l=>garRender(doc,l));},
    redo:()=>{ls.forEach((l,i)=>l.ctx.putImageData(after[i],0,0));rebuildGeoms(doc);ls.slice(1).forEach(l=>garRender(doc,l));},bytes:doc.w*doc.h*8*ls.length});
  invalidate();refreshLayers();if(S.tab.design==='garment')renderSide();
}
function drawFigureGuides(g,doc){
  const L=doc.layers.find(l=>l.tag==='figure');if(!L||!doc.figGuides)return;
  const n=doc.figN||1,{heads}=figParams();
  g.save();g.lineWidth=1/doc.view.z;g.setLineDash([6/doc.view.z,6/doc.view.z]);g.strokeStyle=cssC.acc;g.fillStyle=cssC.acc;g.globalAlpha=.55;g.font=`${12/doc.view.z}px DM Mono,monospace`;
  for(let i=0;i<n;i++){const b=figureBounds(doc,n,i),u=b.H/heads;
    g.beginPath();g.moveTo(b.ox,b.oy-u*.3);g.lineTo(b.ox,b.oy+b.H+u*.2);g.stroke();
    for(let k=0;k<=heads;k++){const y=b.oy+k*u;g.beginPath();g.moveTo(b.ox-u*1.7,y);g.lineTo(b.ox+u*1.7,y);g.stroke();
      if(i===0){g.fillText(String(k),Math.max(2,b.ox-u*1.7-16/doc.view.z),y-3/doc.view.z);}}}
  g.restore();
}

function hslHex(h,sa,l){const c=(1-Math.abs(2*l-1))*sa,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r=0,g=0,b=0;
  if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
  const q=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');return'#'+q(r)+q(g)+q(b);}

  for(let i=0;i<24;i++){const hue=i*15;const hn=['Kırmızı','Kırmızı-turuncu','Turuncu','Turuncu-sarı','Sarı','Sarı-yeşil','Yeşil','Yeşil','Yeşil-turkuaz','Turkuaz','Turkuaz-mavi','Mavi-turkuaz','Mavi','Mavi','Lacivert-mavi','Lacivert','Mor-mavi','Mor','Mor','Mor-pembe','Pembe','Pembe-kırmızı','Kırmızı-pembe','Kırmızı'][i];
    for(const[tn,sa,l]of tones)c.push([tn+' '+hn+' ('+hue+'°)',hslHex(hue,sa,l)]);}

  const sv=SIL_TPL[g]&&SIL_TPL[g].front; if(!sv||!sv.pts)return null;
  const P=sv.pts,n=P.length,xs=[];
  for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];
    if((a[1]-y)*(b[1]-y)<=0&&a[1]!==b[1]){const t=(y-a[1])/(b[1]-a[1]);xs.push(a[0]+t*(b[0]-a[0]));}}

function vnoise(s,cell,seed){

}

const FAB_CATS=['Doğal','Dokuma','Parlak','Yüzeyli','Örgü','Transparan','Süslü','Biçimli','Desen','Hayvan','Deniz','Gece'];
const FABCACHE={};
function makeFabricTile(id,col,s){
  const key=id+col+(S.bg||'')+(s||256);if(FABCACHE[key])return FABCACHE[key];
  const f=FABRICS.find(q=>q.id===id);if(!f)return null;
  const t=f.gen(s||256,col);const ks=Object.keys(FABCACHE);if(ks.length>40)delete FABCACHE[ks[0]];FABCACHE[key]=t;return t;
}
/* dolgu için "döküm" gölgeleri */
function applyDrape(g,bw,bh,kind){
  if(!kind||kind==='none')return;
  g.save();g.globalCompositeOperation='source-atop';
  const R=rng(bw+bh);const phase=[R()*6,R()*6,R()*6];
  for(let x=0;x<bw;x+=2){
    let v;
    if(kind==='soft')v=Math.sin(x/bw*TAU*2.2+phase[0])*.5+Math.sin(x/bw*TAU*5.3+phase[1])*.28;
    else if(kind==='pleat'){const w=(x/(bw/Math.max(6,Math.round(bw/36))))%1;v=(w<.5?w*2:2-w*2)*1.8-.9;}
    else v=Math.sin((x*.8)/bw*TAU*3+phase[2])*.4+Math.sin(x/bw*TAU*9)*.2;
    if(v>0){g.fillStyle=`rgba(0,0,0,${Math.min(.34,v*.32)})`;}else{g.fillStyle=`rgba(255,255,255,${Math.min(.3,-v*.28)})`;}
    g.fillRect(x,0,2,bh);
  }
  g.restore();
}
function fabricThumb(f,col){
  const c=newCanvas(96,96),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,96,96);
  g.fillStyle='#bbb';for(let i=0;i<96;i+=12)for(let j=0;j<96;j+=12)if((i+j)/12%2===0)g.fillRect(i,j,12,12);
  const t=makeFabricTile(f.id,col,256);const pat=g.createPattern(t,'repeat');pat.setTransform(new DOMMatrix().scale(.55));g.fillStyle=pat;g.fillRect(0,0,96,96);return c;
}
function fabricSection(body){
  const grid=h('div');
  FAB_CATS.forEach(cat=>{const items=FABRICS.filter(f=>f.cat===cat);if(!items.length)return;
    const cards=h('div',{class:'cards'});
    items.forEach(f=>{const c=fabricThumb(f,S.fg),on=S.pat.active&&S.pat.active.kind==='fabric'&&S.pat.active.id===f.id;
      cards.append(h('button',{class:'card sq','aria-pressed':String(on),title:f.n,onclick:()=>{S.pat.active={kind:'fabric',id:f.id};S.fill.src='pattern';renderSide();toast('"'+f.n+'" seçildi. Boya aracıyla bölgeye uygula.');}},c,f.n));});
    grid.append(h('div',{class:'sec',style:'margin-bottom:10px'},h('h4',null,cat),cards));});
  body.append(sec('Kumaşlar (ana renkte)',h('div',{class:'note'},'Kumaş ana renkle boyanır. Önce Renk sekmesinden rengi seç, sonra kumaşa dokun. Şeffaf kumaşlar altındaki katmanı gösterir.'),grid));
}

let svCv=null,hueCv=null;
function drawSV(){
  const box=$('#svBox');if(!box)return;
  svCv=svCv||box.querySelector('canvas');const g=svCv.getContext('2d'),w=svCv.width,hh=svCv.height;
  g.fillStyle=hsv2hex(S.hsv[0],1,1);g.fillRect(0,0,w,hh);

  const k=box.querySelector('.knob');k.style.left=S.hsv[1]*100+'%';k.style.top=(1-S.hsv[2])*100+'%';k.style.background=hsv2hex(...S.hsv);

function dragArea(el,fn){
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);const mv=ev=>{const r=el.getBoundingClientRect();fn(clamp((ev.clientX-r.left)/r.width,0,1),clamp((ev.clientY-r.top)/r.height,0,1));};mv(e);
    const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);e.preventDefault();});
}
function applyHSV(){const hx=hsv2hex(...S.hsv);if(S.target==='bg')S.bg=hx;else S.fg=hx;updateColorUI();}
function harmony(hx,kind){
  const[hh,s,v]=hex2hsv(hx),H=d=>hsv2hex((hh+d+360)%360,s,v);
  switch(kind){
    case'comp':return[hx,H(180),hsv2hex(hh,s*.5,Math.min(1,v+.2)),hsv2hex((hh+180)%360,s*.5,Math.min(1,v+.2)),hsv2hex(hh,s,v*.55)];
    case'analog':return[H(-40),H(-20),hx,H(20),H(40)];
    case'triad':return[hx,H(120),H(240),hsv2hex(hh,s*.4,Math.min(1,v+.25)),hsv2hex(hh,s,v*.6)];
    case'split':return[hx,H(150),H(210),hsv2hex(hh,s*.45,Math.min(1,v+.25)),hsv2hex(hh,s,v*.55)];
    case'tetra':return[hx,H(90),H(180),H(270),hsv2hex(hh,s*.4,Math.min(1,v+.2))];
    default:return[0,1,2,3,4].map(i=>hsv2hex(hh,clamp(s*(1.1-i*.18),0,1),clamp(v*(1.25-i*.22),.08,1)));
  }
}

function extractPalette(img,n){
  const c=newCanvas(64,64),g=c.getContext('2d');g.drawImage(img,0,0,64,64);const d=g.getImageData(0,0,64,64).data;
  let px=[];for(let i=0;i<d.length;i+=4)if(d[i+3]>200)px.push([d[i],d[i+1],d[i+2]]);
  const split=(arr,depth)=>{if(depth===0||arr.length<2)return[arr];
    let mn=[255,255,255],mx=[0,0,0];for(const p of arr)for(let k=0;k<3;k++){mn[k]=Math.min(mn[k],p[k]);mx[k]=Math.max(mx[k],p[k]);}
    const ax=[mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]].reduce((a,b,i,r)=>b>r[a]?i:a,0);arr.sort((a,b)=>a[ax]-b[ax]);const m=arr.length>>1;
    return split(arr.slice(0,m),depth-1).concat(split(arr.slice(m),depth-1));};
  const boxes=split(px,Math.log2(n)).filter(b=>b.length);
  const cols=boxes.map(b=>{const s=[0,0,0];b.forEach(p=>{s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];});return{hex:rgb2hex(s[0]/b.length,s[1]/b.length,s[2]/b.length),n:b.length};});
  cols.sort((a,b)=>b.n-a.n);return cols.map(c=>c.hex);
}

/* çoklu seçim ve düzenleme: tıkla = seç, Shift = ekle/çıkar, sürükle = taşı, Alt+sürükle = kopyala ile taşı */
function vecBBox(s){if(s.rings){const q=s.rings.flat();const xs=q.map(p=>p[0]),ys=q.map(p=>p[1]);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];}
  if(s.kind==='pf'){const p=vecBBox(s.a),q=vecBBox(s.b);return[Math.min(p[0],q[0]),Math.min(p[1],q[1]),Math.max(p[2],q[2]),Math.max(p[3],q[3])];}
  if(s.kind==='rect'||s.kind==='ellipse')return[Math.min(s.x,s.x+s.w),Math.min(s.y,s.y+s.h),Math.max(s.x,s.x+s.w),Math.max(s.y,s.y+s.h)];
  const xs=s.pts.map(p=>p[0]),ys=s.pts.map(p=>p[1]);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];}
function vecMoveShape(s,dx,dy){if(s.kind==='pf'){vecMoveShape(s.a,dx,dy);vecMoveShape(s.b,dx,dy);return;}
  if(s.rings){s.rings.forEach(r=>r.forEach(p=>{p[0]+=dx;p[1]+=dy;}));return;}

function selDown(p,e){

function selMoveP(p,e){

  else{const x=Math.min(d.x0,d.x1),y=Math.min(d.y0,d.y1),w=Math.abs(d.x1-d.x0),h2=Math.abs(d.y1-d.y0);

    selApply(doc,g=>{if(d.mode==='ellipse')g.ellipse(x+w/2,y+h2/2,w/2,h2/2,0,0,6.2832);else g.rect(x,y,w,h2);},d.op);}

function drawSelOverlay(g,doc){
  if(SEL.mask){g.save();g.globalAlpha=.09;g.fillStyle=cssC.acc;g.drawImage(SEL.mask,0,0);g.globalCompositeOperation='source-atop';g.restore();
    g.save();g.globalAlpha=.55+.4*Math.sin(performance.now()/260);g.drawImage(SEL.edge,0,0);g.restore();if(!SELDRAG)setTimeout(invalidate,120);}
  if(SELDRAG){const d=SELDRAG;g.save();g.lineWidth=1.6/doc.view.z;g.strokeStyle=cssC.acc;g.fillStyle=cssC.acc;g.globalAlpha=.9;g.setLineDash([6/doc.view.z,4/doc.view.z]);g.beginPath();
    if(d.mode==='lasso')d.pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));

    else g.rect(Math.min(d.x0,d.x1),Math.min(d.y0,d.y1),Math.abs(d.x1-d.x0),Math.abs(d.y1-d.y0));

}

function openAdjust(){
  const doc=D(),L=doc.layers[doc.active];if(!L||S.mode==='board')return;
  const targets=()=>S.adj.all?doc.layers.filter(l=>!l.locked&&l.tag!=='figure'):[L];
  const origs=new Map();doc.layers.forEach(l=>{const c=newCanvas(doc.w,doc.h);c.getContext('2d').drawImage(l.canvas,0,0);origs.set(l,c);});
  const v={hue:0,sat:0,light:0,con:0};
  const hasFilter='filter' in CanvasRenderingContext2D.prototype;
  const live=()=>{
    for(const l of doc.layers){l.ctx.save();l.ctx.globalCompositeOperation='copy';l.ctx.filter='none';l.ctx.drawImage(origs.get(l),0,0);l.ctx.restore();}
    for(const l of targets()){
      const src=origs.get(l);let out=newCanvas(doc.w,doc.h);const g=out.getContext('2d');
      if(hasFilter){g.filter=`hue-rotate(${v.hue}deg) saturate(${100+v.sat}%) brightness(${100+v.light}%) contrast(${100+v.con}%)`;g.drawImage(src,0,0);g.filter='none';}
      else{g.drawImage(src,0,0);const id=g.getImageData(0,0,doc.w,doc.h),d=id.data;for(let i=0;i<d.length;i+=4){let[hh,s,vv]=rgb2hsv(d[i],d[i+1],d[i+2]);hh=(hh+v.hue+360)%360;s=clamp(s*(1+v.sat/100),0,1);vv=clamp(vv*(1+v.light/100),0,1);const c=hsv2rgb(hh,s,vv);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];}g.putImageData(id,0,0);}
      if(l.alphaLock){/* şeffaflık korunur zaten */}
      if(SEL.mask){const keep=newCanvas(doc.w,doc.h),kg=keep.getContext('2d');kg.drawImage(src,0,0);kg.globalCompositeOperation='destination-in';kg.drawImage(SEL.inv,0,0);
        const ch=newCanvas(doc.w,doc.h),cg=ch.getContext('2d');cg.drawImage(out,0,0);cg.globalCompositeOperation='destination-in';cg.drawImage(SEL.mask,0,0);
        l.ctx.save();l.ctx.globalCompositeOperation='copy';l.ctx.drawImage(keep,0,0);l.ctx.globalCompositeOperation='source-over';l.ctx.drawImage(ch,0,0);l.ctx.restore();}
      else{l.ctx.save();l.ctx.globalCompositeOperation='copy';l.ctx.drawImage(out,0,0);l.ctx.restore();}
    }
    invalidate();
  };
  let raf=0;const sched=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(live);};
  const sl=(label,key,min,max)=>{const o=h('output',null,'0');return h('div',{class:'row'},h('label',null,label),h('input',{type:'range',min,max,step:1,value:0,'aria-label':label,oninput:e=>{v[key]=+e.target.value;o.textContent=v[key];sched();}}),o);};
  const all=toggleRow('Tüm katmanlara uygula (manken hariç)',S.adj.all,x=>{S.adj.all=x;chk.replaceWith(toggleRow('Tüm katmanlara uygula (manken hariç)',x,()=>{}));sched();});
  const chk=h('div');
  const cancel=()=>{for(const l of doc.layers){l.ctx.save();l.ctx.globalCompositeOperation='copy';l.ctx.drawImage(origs.get(l),0,0);l.ctx.restore();}invalidate();closeModal();};
  const apply=()=>{
    const changed=doc.layers.filter(l=>{return v.hue||v.sat||v.light||v.con;}).length&&targets();
    if(!(v.hue||v.sat||v.light||v.con)){closeModal();return;}
    const ts=targets(),news=ts.map(l=>{const n=newCanvas(doc.w,doc.h);n.getContext('2d').drawImage(l.canvas,0,0);return[l,n];}),olds=ts.map(l=>[l,origs.get(l)]);
    const put=a=>{for(const[l,c]of a){l.ctx.save();l.ctx.globalCompositeOperation='copy';l.ctx.drawImage(c,0,0);l.ctx.restore();}};
    structEntry(doc,()=>put(olds),()=>put(news),doc.w*doc.h*8*ts.length);closeModal();refreshLayers();invalidate();toast('Renk ayarı uygulandı.');
  };
  openModal('Renk ayarı (renk varyasyonu)',h('div',{class:'bd'},sl('Renk tonu','hue',-180,180),sl('Doygunluk','sat',-100,100),sl('Parlaklık','light',-60,60),sl('Kontrast','con',-60,60),
    h('div',{class:'row'},h('label',{style:'flex:1;color:var(--fg)'},'Tüm katmanlar (manken hariç)'),h('button',{class:'ibtn','aria-pressed':String(S.adj.all),onclick:e=>{S.adj.all=!S.adj.all;e.currentTarget.setAttribute('aria-pressed',String(S.adj.all));e.currentTarget.textContent=S.adj.all?'Açık':'Kapalı';sched();},style:'min-width:70px'},S.adj.all?'Açık':'Kapalı')),
    h('div',{class:'note'},SEL.mask?'Sadece seçili alana uygulanır.':'Aynı modelin farklı renk seçeneklerini hızlıca üretmek için kullan.')),
    [h('button',{class:'ibtn',onclick:cancel},'Vazgeç'),h('button',{class:'ibtn pri',onclick:apply},'Uygula')]);

const aNorm=s=>s.toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9 ]/g,' ');
function aAnswer(q){
  const qw=aNorm(q).split(' ').filter(w=>w.length>=3);
  if(!qw.length)return null;
  /* bulanık eşleşme: yazım hatası ve kısaltmalara tolerans (Levenshtein ≤ 1 kök karşılaştırması) */
  const lev=(a,b)=>{const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;
    for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];};
  const hit=(w,k)=>k.length>=3&&(w.includes(k)||k.includes(w)||(k.length>=5&&lev(w.slice(0,k.length+1),k)<=1));
  /* araç açıklamaları: her araç için kendi cevabı */
  const toolKB=TOOLS.filter(t=>Array.isArray(t)&&t.length>=4).map(t=>({k:[aNorm(t[1])],a:t[1]+' aracı: kısayolu '+t[3]+'. Sol araç çubuğundan ya da kısayoldan seçebilirsin.'}));
  const kb=ASSIST_KB.concat(toolKB).map(e=>({e,s:e.k.filter(k=>qw.some(w=>hit(w,aNorm(k)))).length})).filter(x=>x.s>0).sort((a,b)=>(b.s-a.s)||((b.e.a.startsWith('Bu programda')?1:0)-(a.e.a.startsWith('Bu programda')?1:0))).slice(0,2).map(x=>x.e.a);
  const cmds=allCommands().map(c=>({c,s:qw.filter(w=>aNorm(c.label+' '+c.group).includes(w)).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6).map(x=>x.c);
  return{kb,cmds};

window.addEventListener('keydown',e=>{
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'&&tg.type!=='range'&&tg.type!=='color'||tg.tagName==='TEXTAREA'||tg.isContentEditable||tg.tagName==='SELECT'))return;
  if(!$('#modal').hidden){if(e.key==='Escape'){closeModal();e.preventDefault();}return;}
  if(e.code==='Space'){spaceDown=true;e.preventDefault();return;}
  const mod=e.ctrlKey||e.metaKey;let key=e.key.toLowerCase();
  if(key==='='&&!mod)key='=';
  if(e.key==='?')key='?';
  if(mod&&e.altKey&&false)return;
  /* ok tuşları */
  if(key.startsWith('arrow')&&S.tool==='move'&&S.mode!=='board'){const st=e.shiftKey?10:1,d={arrowleft:[-st,0],arrowright:[st,0],arrowup:[0,-st],arrowdown:[0,st]}[key];if(nudge(d[0],d[1])){e.preventDefault();return;}}
  if(S.mode==='board'){if(key==='delete'||key==='backspace'){if(BOARD.sel)boardDelete();return;}}
  for(const k of KEYS){
    if(!k.keys||k.display)continue;const p=k._p||(k._p=parseKeys(k.keys));
    let kk=key;if(p.key==='['&&(e.code==='BracketLeft'))kk='[';if(p.key===']'&&(e.code==='BracketRight'))kk=']';
    if(e.altKey&&/^digit\d$/i.test(e.code))kk=e.code.slice(-1);
    if(e.altKey&&/^key[a-z]$/i.test(e.code))kk=e.code.slice(-1).toLowerCase();
    if(kk!==p.key)continue;
    if(p.ctrl!==mod)continue;if(p.alt!==e.altKey)continue;
    if(p.shift!==e.shiftKey&&!(p.key==='?'||p.key==='='||p.key==='-'&&false))continue;
    if(p.key==='='&&mod&&!p.ctrl)continue;
    e.preventDefault();k.run();return;
  }
  if(mod&&(key==='+'||key==='='||(key==='-'))){e.preventDefault();zoomBy(key==='-'?1/1.25:1.25);}
});
