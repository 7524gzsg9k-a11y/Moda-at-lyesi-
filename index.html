const PATCACHE={};
function repeatUnit(tile,mode){
  const w=tile.width,hh=tile.height;let c,g;
  if(mode==='halfdrop'){c=newCanvas(w*2,hh);g=c.getContext('2d');g.drawImage(tile,0,0);g.drawImage(tile,w,hh/2);g.drawImage(tile,w,hh/2-hh);}
  else if(mode==='halfbrick'){c=newCanvas(w,hh*2);g=c.getContext('2d');g.drawImage(tile,0,0);g.drawImage(tile,w/2,hh);g.drawImage(tile,w/2-w,hh);}
  else if(mode==='mirror'){c=newCanvas(w*2,hh*2);g=c.getContext('2d');g.drawImage(tile,0,0);
    g.save();g.translate(w*2,0);g.scale(-1,1);g.drawImage(tile,0,0);g.restore();
    g.save();g.translate(0,hh*2);g.scale(1,-1);g.drawImage(tile,0,0);g.restore();
    g.save();g.translate(w*2,hh*2);g.scale(-1,-1);g.drawImage(tile,0,0);g.restore();}
  else return tile;
  return c;
}
function tileFromDoc(doc){const c=newCanvas(doc.w,doc.h),g=c.getContext('2d');drawDoc(g,doc,{bg:true});return c;}
function currentPatternCanvas(){
  const a=S.pat.active;if(!a)return null;
  let tile;
  if(a.kind==='preset'){const def=PRESETS.find(p=>p.id===a.id);tile=makePresetTile(a.id,S.pat.c1,S.pat.c2,S.pat.c3,def.s*2);}
  else if(a.kind==='fabric')tile=makeFabricTile(a.id,S.fg,256);
  else tile=PATCACHE[a.id];
  if(!tile)return null;
  return repeatUnit(tile,S.pat.fillRepeat);
}

function drawPrev(){
  if(S.mode!=='pattern'||prevRaf)return;
  prevRaf=requestAnimationFrame(()=>{prevRaf=0;
    const doc=DOCS.pattern,pc=$('#pvCv');if(!doc||!pc)return;

function paintRepeat(canvas,tile,mode,scale,rot){
  const g=canvas.getContext('2d'),unit=repeatUnit(tile,mode);
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,canvas.width,canvas.height);
  const pat=g.createPattern(unit,'repeat'),base=canvas.width/(tile.width*2.4)*scale;
  pat.setTransform(new DOMMatrix().translate(canvas.width/2,canvas.height/2).rotate(rot).scale(base).translate(-tile.width/2,-tile.height/2));
  g.fillStyle=pat;g.fillRect(0,0,canvas.width,canvas.height);
}

/* toBlob bazı ortamlarda geri çağrı vermeyebilir: zaman aşımında veri URL'sinden blob üretilir (kayıt ve galeri takılmaz) */
const toBlob=(c,t,q)=>new Promise(res=>{let done=false;const fin=b=>{if(!done){done=true;res(b);}};
  const fb=()=>{try{const u=c.toDataURL(t||'image/png',q);const bin=atob(u.split(',')[1]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);fin(new Blob([a],{type:t||'image/png'}));}catch(e){fin(null);}};
  const tm=setTimeout(fb,4000);
  try{c.toBlob(b=>{clearTimeout(tm);if(b)fin(b);else fb();},t||'image/png',q);}catch(e){clearTimeout(tm);fb();}});

}
function blobToImg(b){return new Promise((res,rej)=>{const u=URL.createObjectURL(b),i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),2000);};i.onerror=rej;i.src=u;});}
async function docFromRecord(rec,kind){
  const doc=makeDoc(rec.w,rec.h,kind);doc.bg=rec.bg||{color:'#fff',visible:true};doc.figN=rec.figN||1;doc.figGuides=!!rec.figGuides;
  for(const l of rec.layers){const L=makeLayer(doc,l.name);Object.assign(L,{group:l.group||'',visible:l.visible,opacity:l.opacity,blend:l.blend,locked:l.locked,alphaLock:l.alphaLock,clip:l.clip,tag:l.tag||''});if(l.gar){try{L.gar=JSON.parse(l.gar);}catch(e){}}

    try{const img=await blobToImg(l.blob);L.ctx.drawImage(img,0,0);}catch(e){}doc.layers.push(L);}

/* ---- v18: PSD (Photoshop) dışa aktarma: ham (sıkıştırmasız) 8-bit RGBA katmanlar ---- */
const PSD_BLEND={'source-over':'norm','multiply':'mul ','screen':'scrn','overlay':'over','darken':'dark','lighten':'lite','color-dodge':'div ','color-burn':'idiv','hard-light':'hLit','soft-light':'sLit','difference':'diff','exclusion':'smud','hue':'hue ','saturation':'sat ','color':'colr','luminosity':'lum '};

  const btn=(label,sub,fn)=>h('button',{class:'card',style:'flex-direction:row;justify-content:flex-start;text-align:left;padding:10px 12px;gap:10px;align-items:center',onclick:async()=>{toast('Hazırlanıyor…',2500);try{await fn();}catch(e){toast('Dışa aktarma hatası: '+(e&&e.message||e));}}},
    h('span',{style:'display:flex;flex-direction:column;gap:2px'},h('b',null,label),h('span',{style:'font-weight:400;color:var(--muted);font-size:11.5px'},sub)));
  const list=h('div',{class:'bcards',style:'grid-template-columns:1fr'});
  list.append(btn('PNG görsel','Beyaz zeminli, paylaşmak için',async()=>saveFile(await toBlob(flatten(doc,false,scale)),nm+'.png')));
  list.append(btn('PNG şeffaf','Zemin olmadan, katmanlar birleşik',async()=>saveFile(await toBlob(flatten(doc,true,scale)),nm+'-seffaf.png')));
  list.append(btn('JPG','Küçük dosya, baskı provası',async()=>saveFile(await toBlob(flatten(doc,false,scale),'image/jpeg',.92),nm+'.jpg')));
  list.append(btn('PSD (Photoshop)','Katmanlar ayrı ayrı, şeffaf; Photoshop ve Photopea açar',async()=>saveFile(makePSD(doc),nm+'.psd')));
  list.append(btn('PDF','Tek sayfa, 200 dpi',async()=>saveFile(await makePDF(flatten(doc,false,scale)),nm+'.pdf')));
  list.append(btn('Katmanlar (ZIP)','Her katman ayrı şeffaf PNG + birleşik görsel',async()=>{
    const files=[];for(let i=0;i<doc.layers.length;i++){const L=doc.layers[i],b=await toBlob(L.canvas);files.push({name:String(i+1).padStart(2,'0')+'-'+slug(layerLabel(L))+'.png',data:new Uint8Array(await b.arrayBuffer())});}
    files.push({name:'birlesik.png',data:new Uint8Array(await (await toBlob(flatten(doc,false,1))).arrayBuffer())});saveFile(zipStore(files),nm+'-katmanlar.zip');}));
  if(S.mode==='pattern'){
    list.append(btn('Tekrarlı desen görseli','Seçili tekrar düzeninde 3000×2000 PNG',async()=>{const c=newCanvas(3000,2000);paintRepeat(c,tileFromDoc(doc),S.pat.repeat,S.pat.scale*1.5,S.pat.rot);saveFile(await toBlob(c),nm+'-tekrar.png');}));
  }else{
    list.append(btn('Proje dosyası (.json)','Yedek: tüm katmanlar ve defter, başka cihaza taşınabilir',async()=>{await saveNow(false);const rec=await IDB.get('projects',P.id);saveFile(await projectToJson(rec),nm+'.moda.json');}));
  }
  const sc=h('select',{onchange:e=>scale=+e.target.value},[[.5,'Yarım boyut'],[1,'Tam boyut ('+doc.w+'×'+doc.h+')'],[1.5,'1,5× büyük'],[2,'2× büyük']].map(([v,t])=>h('option',{value:v,selected:v===1},t)));
  openModal('Dışa aktar',h('div',{class:'bd'},h('div',{class:'row'},h('label',null,'Boyut'),sc),list),[h('button',{class:'ibtn',onclick:closeModal},'Kapat')]);
}
function blobToDataURL(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});}
async function projectToJson(rec){
  const o=Object.assign({},rec,{app:'moda-atolyesi',v:1});o.layers=[];
  for(const l of rec.layers)o.layers.push(Object.assign({},l,{blob:await blobToDataURL(l.blob)}));
  return new Blob([JSON.stringify(o)],{type:'application/json'});
}
async function projectFromJson(txt){
  const o=JSON.parse(txt);if(o.app!=='moda-atolyesi')throw new Error('Bu dosya Moda Atölyesi projesi değil.');
  for(const l of o.layers){const r=await fetch(l.blob);l.blob=await r.blob();}
  o.id='pr'+uid();o.updated=Date.now();return o;
}
$('#fileProj').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const rec=await projectFromJson(await f.text());await IDB.put('projects',rec);closeModal();toast('Proje içe aktarıldı.');loadProject(rec.id);}catch(err){toast('Açılamadı: '+(err.message||'geçersiz dosya'));}
});

/* ============ defter (moodboard) ============ */
const BOARD={items:[],sel:null,z:1};
function boardItemEl(it){
  const el=h('div',{class:'bi '+(it.type==='note'?'note':it.type==='title'?'title':it.type==='pal'?'pal':''),'data-id':it.id,style:`left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;z-index:${it.z||1}`});
  if(it.type==='img')el.append(h('img',{src:it.src,alt:'',draggable:'false'}));
  else if(it.type==='note'||it.type==='title'){const t=h('div',{contenteditable:'true',spellcheck:'false','aria-label':'Metin'});t.textContent=it.text;t.addEventListener('input',()=>{it.text=t.innerText;P&&(P.dirty=true,scheduleSave());});t.addEventListener('pointerdown',e=>{if(BOARD.sel===it.id)e.stopPropagation();});el.append(t);}
  else if(it.type==='pal')it.colors.forEach(c=>el.append(h('div',{style:'background:'+c,title:c,onclick:()=>setFg(c)},c.toUpperCase())));
  el.addEventListener('pointerdown',e=>boardDown(e,it,el));
  return el;
}
function renderBoard(){
  const inner=$('#bInner');inner.innerHTML='';
  BOARD.items.forEach(it=>inner.append(boardItemEl(it)));
  if(!BOARD.items.length)inner.append(h('div',{style:'position:absolute;left:60px;top:60px;max-width:420px;color:var(--muted);font-size:15px;line-height:1.5'},'Defter boş. İlham görselleri, kumaş fotoğrafları, renk paletleri ve notlar ekle; tasarımınla yan yana düşün.'));
  const tools=$('#bTools');tools.innerHTML='';
  const add=(ic2,t,fn)=>tools.append(h('button',{class:'ibtn',onclick:fn,html:ic(ic2)},h('span',{class:'lbl'},t)));
  add('image','Görsel ekle',()=>$('#fileImgs').click());add('note','Not',()=>addBoardText('note'));add('title','Başlık',()=>addBoardText('title'));
  add('palette','Mevcut palet',addBoardPalette);add('brush','Tasarımdan ekle',()=>addBoardSnapshot('design'));add('tile','Desenden ekle',()=>addBoardSnapshot('pattern'));
  tools.append(h('div',{class:'spacer'}));
  tools.append(h('button',{class:'ibtn',disabled:!BOARD.sel,onclick:()=>boardZ(1),html:ic('up')},h('span',{class:'lbl'},'Öne')));
  tools.append(h('button',{class:'ibtn',disabled:!BOARD.sel,onclick:()=>boardZ(-1),html:ic('dn')},h('span',{class:'lbl'},'Arkaya')));
  tools.append(h('button',{class:'ibtn danger',disabled:!BOARD.sel,onclick:boardDelete,html:ic('trash')},h('span',{class:'lbl'},'Sil')));
  if(BOARD.sel){const el=$(`.bi[data-id="${BOARD.sel}"]`);if(el)selectEl(el);}
}
function selectEl(el){$$('.bi').forEach(b=>{b.classList.remove('sel');$$('.bhandle,.bbar',b).forEach(x=>x.remove());});
  if(!el)return;el.classList.add('sel');el.append(h('div',{class:'bhandle','data-h':'1'}));}
function bcenter(){const a=$('#bArea');return{x:a.scrollLeft+a.clientWidth/2,y:a.scrollTop+a.clientHeight/2};}
function addItem(it){const c=bcenter();it.id=uid();it.x=Math.max(10,Math.round(c.x-it.w/2+(Math.random()*40-20)));it.y=Math.max(10,Math.round(c.y-it.h/2+(Math.random()*40-20)));it.z=++BOARD.z;BOARD.items.push(it);BOARD.sel=it.id;if(P){P.dirty=true;scheduleSave();}renderBoard();}
function addBoardText(type){addItem(type==='note'?{type,w:220,h:170,text:'Not…'}:{type,w:420,h:70,text:'Koleksiyon başlığı'});}
function addBoardPalette(){addItem({type:'pal',w:360,h:90,colors:[S.fg,S.bg,...S.recent.slice(0,4)].filter((c,i,a)=>a.indexOf(c)===i).slice(0,6)});}
function addBoardSnapshot(kind){
  const doc=DOCS[kind];if(!doc)return;const c=flatten(doc,false,1),k=Math.min(1,520/Math.max(c.width,c.height)),t=newCanvas(Math.round(c.width*k),Math.round(c.height*k));t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  addItem({type:'img',w:t.width,h:t.height,src:t.toDataURL('image/jpeg',.88)});
}
$('#fileImgs').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';
  for(const f of files){try{const img=await blobToImg(f),k=Math.min(1,1000/Math.max(img.width,img.height)),c=newCanvas(Math.round(img.width*k),Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const d=Math.min(1,320/Math.max(c.width,c.height));addItem({type:'img',w:Math.round(c.width*d),h:Math.round(c.height*d),src:c.toDataURL('image/jpeg',.86)});}catch(err){toast('Bir görsel açılamadı.');}}
});
let bDrag=null;
function boardDown(e,it,el){
  if(e.target.closest('[contenteditable]')&&BOARD.sel===it.id)return;
  e.stopPropagation();BOARD.sel=it.id;it.z=++BOARD.z;el.style.zIndex=it.z;selectEl(el);
  const resize=!!e.target.closest('.bhandle');
  bDrag={it,el,resize,x:e.clientX,y:e.clientY,ox:it.x,oy:it.y,ow:it.w,oh:it.h,ratio:it.w/it.h};
  el.setPointerCapture(e.pointerId);
  const mv=ev=>{const dx=ev.clientX-bDrag.x,dy=ev.clientY-bDrag.y;
    if(bDrag.resize){let w=Math.max(60,bDrag.ow+dx),hh=it.type==='img'||it.type==='pal'?w/bDrag.ratio:Math.max(40,bDrag.oh+dy);it.w=Math.round(w);it.h=Math.round(hh);el.style.width=it.w+'px';el.style.height=it.h+'px';}
    else{it.x=Math.max(0,Math.round(bDrag.ox+dx));it.y=Math.max(0,Math.round(bDrag.oy+dy));el.style.left=it.x+'px';el.style.top=it.y+'px';}};
  const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);bDrag=null;if(P){P.dirty=true;scheduleSave();}renderBoardToolsOnly();};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  renderBoardToolsOnly();
}
function renderBoardToolsOnly(){$$('#bTools .ibtn').forEach(b=>{if(/Öne|Arkaya|Sil/.test(b.textContent)||b.classList.contains('danger'))b.disabled=!BOARD.sel;});}
$('#bArea').addEventListener('pointerdown',e=>{if(e.target.id==='bArea'||e.target.id==='bInner'){BOARD.sel=null;selectEl(null);renderBoardToolsOnly();}});
function boardZ(d){const it=BOARD.items.find(i=>i.id===BOARD.sel);if(!it)return;it.z=d>0?++BOARD.z:Math.max(0,Math.min(...BOARD.items.map(i=>i.z||1))-1);P&&(P.dirty=true,scheduleSave());renderBoard();}
function boardDelete(){BOARD.items=BOARD.items.filter(i=>i.id!==BOARD.sel);if(P)P.board.items=BOARD.items;BOARD.sel=null;P&&(P.dirty=true,scheduleSave());renderBoard();}
async function exportBoard(){
  if(!BOARD.items.length){toast('Defter boş.');return;}
  let x0=1e9,y0=1e9,x1=0,y1=0;BOARD.items.forEach(i=>{x0=Math.min(x0,i.x);y0=Math.min(y0,i.y);x1=Math.max(x1,i.x+i.w);y1=Math.max(y1,i.y+i.h);});
  const pad=40,c=newCanvas(x1-x0+pad*2,y1-y0+pad*2),g=c.getContext('2d');g.fillStyle='#f3f1ec';g.fillRect(0,0,c.width,c.height);
  const items=[...BOARD.items].sort((a,b)=>(a.z||0)-(b.z||0));
  for(const it of items){const x=it.x-x0+pad,y=it.y-y0+pad;
    if(it.type==='img'){const img=await blobToImg(await (await fetch(it.src)).blob());g.save();g.shadowColor='rgba(0,0,0,.25)';g.shadowBlur=10;g.drawImage(img,x,y,it.w,it.h);g.restore();}
    else if(it.type==='pal'){const n=it.colors.length;it.colors.forEach((cl,i)=>{g.fillStyle=cl;g.fillRect(x+i*it.w/n,y,it.w/n,it.h);});}
    else{const note=it.type==='note';if(note){g.fillStyle='#fff3b0';g.fillRect(x,y,it.w,it.h);}
      g.fillStyle='#222';g.textBaseline='top';const fs=note?20:38;g.font=note?`600 ${fs}px Caveat,sans-serif`:`700 ${fs}px 'Playfair Display',serif`;
      let ly=y+(note?10:4);for(const para of String(it.text).split('\n')){let line='';for(const wd of para.split(' ')){const t=line?line+' '+wd:wd;if(g.measureText(t).width>it.w-(note?20:8)&&line){g.fillText(line,x+(note?10:4),ly);ly+=fs*1.25;line=wd;}else line=t;}g.fillText(line,x+(note?10:4),ly);ly+=fs*1.25;}}}
  saveFile(await toBlob(c),slug(P&&P.name)+'-defter.png');
}

/* ============ mod geçişi ve başlangıç ============ */
function switchMode(m){
  if(S.mode==='move')commitMove();cancelTransient();
  S.mode=m;$$('#modes button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===m)));
  const board=m==='board';$('#work').hidden=board;$('#board').hidden=!board;
  if(board){renderBoard();}
  else{if(m==='pattern'&&!DOCS.pattern)DOCS.pattern=newPatternDoc(512);
    $('#work').style.display='flex';resizeCv();fitView();renderTools();renderQuick();renderFloat();renderSide();renderPrevCard();updateUndoUI();invalidate();}
  if(board)$('#work').style.display='none';
}
$$('#modes button').forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));
$('#btnUndo').innerHTML=ic('undo');$('#btnRedo').innerHTML=ic('redo');
$('#btnUndo').addEventListener('click',undo);$('#btnRedo').addEventListener('click',redo);
$('#btnGallery').innerHTML=ic('folder')+'<span class="lbl">Projeler</span>';$('#btnGallery').addEventListener('click',openGallery);
$('#btnExport').innerHTML=ic('down')+'<span class="lbl">Dışa aktar</span>';$('#btnExport').addEventListener('click',openExport);
$('#btnTheme').innerHTML=ic('sun');$('#btnTheme').addEventListener('click',()=>{const order=['auto','light','dark'];applyTheme(order[(order.indexOf(S.theme||'auto')+1)%3]);toast('Tema: '+({auto:'sistem',light:'açık',dark:'koyu'}[S.theme]));});
$('#btnPanel').innerHTML=ic('panel')+'<span class="lbl" style="display:inline">Seçenekler</span>';$('#btnPanel').addEventListener('click',()=>{S.panelOpen=!S.panelOpen;$('#side').classList.toggle('open',S.panelOpen);});
new ResizeObserver(()=>{if(S.mode!=='board'){resizeCv();
  /* tuval boyutu değişince, kullanıcı yakınlaştırmadıysa sayfa yeniden sığdırılır (kayma ve kesilme olmasın) */
  const d=D();if(d&&d.view&&(d.view.fitZ==null||Math.abs(d.view.z-d.view.fitZ)<1e-9))fitView(d);}}).observe($('#cvwrap'));
window.addEventListener('beforeunload',()=>{if(P&&P.dirty)saveNow(false);});

(async function init(){
  readCss();
  Object.assign(S,{target:'fg',curve:{smooth:true},theme:'auto'});
  S.fig=Object.assign({tpl:'foto',sex:'kiz',age:'cocuk',style:'croquis',yaw:0,construct:false,cm:170,zS:100,zB:100,zW:100,zH:100,hair:'uzun',hairColor:'#3a2a22',shoe:'topuklu',shoeColor:'#2b2f36',fillMode:'ten',face:true,build:'standart',body:'standart'},S.fig,{body:'standart'});
  if(S.fig.gender==='c')S.fig.gender='k';
  S.fill.angle=90;S.stamp.centre=true;S.pat.fillScale=.5;
  S.pat=Object.assign(S.pat,{c1:'#f1eee8',c2:'#1a2848',c3:'#b98a52',fillRepeat:'straight',repeat:'straight',editId:null,editName:''});
  S.shape.fill='stroke';S.shape.dash=false;S.text.weight='600';
  S.palettes=[];S.lib=[];
  await IDB.open();
  if(IDB.ok){
    S.palettes=await kvGet('palettes',[]);S.recent=await kvGet('recent',[]);
    const th=await kvGet('theme','auto');applyTheme(th);S.finger=await kvGet('finger','auto');
    await loadLib();
    const rec=await kvGet('patdoc',null);if(rec){try{DOCS.pattern=await docFromRecord(rec,'pattern');S.pat.editId=rec.editId||null;S.pat.editName=rec.editName||'';S.pat.repeat=rec.repeat||'straight';}catch(e){}}
    const last=await kvGet('lastProject',null);if(last){const r=await IDB.get('projects',last);if(r){try{DOCS.design=await docFromRecord(r,'design');await pagesFromRec(r);P={id:r.id,name:r.name,created:r.created,updated:r.updated,dirty:false,board:r.board||{items:[]}};if(r.figure)Object.assign(S.fig,r.figure);}catch(e){}}}
  }
  if(!DOCS.design){await createDesign('kadin','mid','İlk tasarımım');P.dirty=true;}
  else{BOARD.items=P.board.items;BOARD.z=Math.max(1,...BOARD.items.map(i=>i.z||1));$('#projName').value=P.name;}
  $$('.nm').forEach(()=>{});
  resizeCv();fitView(DOCS.design);renderTools();renderQuick();renderFloat();renderSide();updateUndoUI();invalidate();
  setSaveState(IDB.ok?'':'Kayıt kapalı');
  window.__ready=true;
})();

</script>
